company: Haapaharju Oy
document: Haapaharju Oy customer-service policy handbook
clause_count: 30
discount_authority_limits:
  Rental Coordinator: 0%
  Senior Coordinator: 5%
  Branch Manager: 10%
  Regional Manager: 15%
escalation_contacts:
  safety: Safety & Compliance Lead (safety@haapaharju.example)
  data_request: Data Protection Contact (tietosuoja@haapaharju.example)
clauses:
- id: H-01
  category: deposits
  title: Refundable damage deposit
  text: A refundable damage deposit is charged at booking for all machinery and lift rentals. The deposit
    is returned in full within five (5) working days of the equipment being checked in, provided the equipment
    is undamaged and complete.
- id: H-02
  category: deposits
  title: Deposit forfeiture
  text: The deposit is forfeited in full, with no exceptions, if the equipment is returned damaged beyond
    normal wear, missing accessories, or more than seven (7) calendar days late.
- id: H-03
  category: deposits
  title: Deposit-exempt rentals
  text: Deposits are not required for hand tools and site-consumable rentals under €150 total value.
- id: H-04
  category: damage_charges
  title: Damage assessment
  text: Damage charges are assessed against the standard repair-cost schedule maintained at each depot
    and communicated to the customer within five (5) working days of check-in.
- id: H-05
  category: damage_charges
  title: Pre-existing damage
  text: No damage charge applies where the damage is confirmed, from check-out photographs or the depot's
    own pre-rental inspection record, to have existed before the rental began.
- id: H-06
  category: damage_charges
  title: Damage charges are final
  text: Damage charges assessed under clause H-04 are final once the repair-cost schedule has been applied
    and communicated; they are not negotiable or waivable after the event, including for a first-time
    or long-standing customer.
- id: H-07
  category: damage_charges
  title: Cosmetic damage
  text: Cosmetic damage that does not affect the safe or working operation of the equipment is chargeable
    at 50% of the relevant repair-cost schedule line, not waived.
- id: H-08
  category: damage_charges
  title: Total loss or theft
  text: Total loss or theft of rented equipment is charged at full replacement value, less any deposit
    held, regardless of insurance status (see H-15–H-17).
- id: H-09
  category: late_returns
  title: Late return fee
  text: A late return fee equal to 100% of the daily rate applies for each calendar day the equipment
    is returned after the agreed end date. The fee is not waived for weather, traffic, or site-schedule
    delays.
- id: H-10
  category: late_returns
  title: Grace day
  text: Customers who notify the depot before the agreed end date that a return will be late receive one
    grace day free of the late fee, once per rolling 12-month period per account.
- id: H-11
  category: late_returns
  title: Verbal extensions
  text: Late fees are calculated from the agreed end date on the rental agreement, not from any informal
    extension discussed verbally; verbal extensions must be confirmed in writing to take effect.
- id: H-12
  category: cancellation_windows
  title: Cancellation more than 48 hours out
  text: Bookings cancelled more than 48 hours before the scheduled pickup time are refunded in full.
- id: H-13
  category: cancellation_windows
  title: Late cancellation forfeiture
  text: Bookings cancelled within 48 hours of the scheduled pickup time forfeit 50% of the booking value;
    bookings cancelled after pickup has occurred forfeit the full first rental day, with no exceptions
    for change of mind or site delay.
- id: H-14
  category: cancellation_windows
  title: Cancellation by Haapaharju Oy
  text: Where Haapaharju Oy cancels or is unable to fulfil a confirmed booking (equipment unavailability,
    breakdown of the reserved unit), the customer receives a full refund of any sums paid plus a 10% goodwill
    credit toward a future rental.
- id: H-15
  category: insurance
  title: Damage Waiver Cover is optional
  text: Optional Damage Waiver Cover (DWC) may be purchased at booking for a daily fee shown in the price
    list; it is not included in the base rental price.
- id: H-16
  category: insurance
  title: DWC exclusions
  text: DWC does not cover loss or damage caused by operating equipment outside its stated working limits,
    unauthorised use by a person not named on the rental agreement, or damage to tyres, tracks, and consumable
    parts.
- id: H-17
  category: insurance
  title: Equivalent third-party cover
  text: Customers may provide evidence of equivalent third-party plant-insurance cover in place of purchasing
    DWC; the depot manager confirms adequacy before pickup.
- id: H-18
  category: discount_authority
  title: Rental Coordinator authority
  text: Rental Coordinators may not apply any discretionary discount; list price and published promotional
    rates only.
- id: H-19
  category: discount_authority
  title: Senior Coordinator authority
  text: Senior Coordinators may apply a discretionary discount of up to 5% on a single booking.
- id: H-20
  category: discount_authority
  title: Branch Manager authority
  text: Branch Managers may apply a discretionary discount of up to 10% on a single booking, or on a standing
    account arrangement reviewed annually.
- id: H-21
  category: discount_authority
  title: Regional Manager authority
  text: Regional Managers may apply a discretionary discount of up to 15% on a single booking; this is
    the highest discount authority held anywhere in the company. Any request beyond 15% must be referred
    to the Managing Director, who is not part of the standard approval chain.
- id: H-22
  category: escalation_duties
  title: Safety and injury escalation
  text: Any report of injury, near-miss, or equipment failure that created a safety risk during a rental
    must be escalated immediately to the Safety & Compliance Lead. No commitment, apology framed as an
    admission of fault, or drafted reply is sent to the customer without the Safety & Compliance Lead's
    sign-off.
- id: H-23
  category: escalation_duties
  title: Safety recalls
  text: Equipment recalled for a safety defect is withdrawn from the fleet immediately on notice from
    the manufacturer or the Safety & Compliance Lead; affected customers are contacted proactively, not
    on request.
- id: H-24
  category: escalation_duties
  title: Confirmed equipment fault
  text: Where a confirmed equipment fault caused a rental to be unusable for part or all of its booked
    period, the customer is entitled to a pro-rated refund for the unusable period plus a goodwill credit,
    without needing to raise a formal complaint.
- id: H-25
  category: escalation_duties
  title: Financial-loss complaints
  text: Complaints alleging financial loss caused by Haapaharju Oy's error (beyond the direct rental cost)
    are escalated to the Branch Manager; front-line staff do not settle these directly.
- id: H-26
  category: data_requests
  title: Personal-data requests
  text: Requests to access, correct, or delete personal data held about a customer are escalated to the
    Data Protection Contact, who responds within the statutory period. Front-line staff do not action
    deletion or export requests themselves.
- id: H-27
  category: data_requests
  title: Marketing preferences
  text: Marketing communications preferences can be changed by front-line staff directly and do not require
    escalation to the Data Protection Contact.
- id: H-28
  category: general
  title: Availability is not a guarantee until confirmed
  text: Equipment availability is checked in the live booking system at the time of enquiry; verbal availability
    given more than 24 hours before pickup is indicative, not guaranteed, until the booking is confirmed.
- id: H-29
  category: general
  title: Confirmed price is locked
  text: A confirmed booking's price is locked at the price shown at confirmation; subsequent price-list
    changes do not apply retroactively to an already-confirmed booking.
- id: H-30
  category: general
  title: Invoice queries
  text: Invoice queries must be raised within 30 days of the invoice date; front-line staff may correct
    clear invoicing errors (wrong rate applied, arithmetic mistakes) at any time without escalation.
