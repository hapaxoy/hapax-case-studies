<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>150 emails, one pipeline – a Hapax case study</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist+Mono:wght@400;500&display=swap" />
<style>
:root{
  --hpx-bg:#FBFAF5; --hpx-ink:#1A1410; --hpx-oxblood:#7A2018; --hpx-navy:#1F2A52;
  --hpx-wine:#A8352A; --hpx-indigo:#41529E; --hpx-gold:#B68A2C; --hpx-grey:#665E58; --hpx-beige:#EFE5CE;
  --hpx-mute:rgba(26,20,16,.62); --hpx-mute2:rgba(26,20,16,.42); --hpx-mute3:rgba(26,20,16,.22);
  --hpx-rule:rgba(26,20,16,.16); --hpx-rule-soft:rgba(26,20,16,.08);
  --hpx-serif:"Cormorant Garamond",Georgia,serif; --hpx-mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
.hpx-page,.hpx-page *,.hpx-page *::before,.hpx-page *::after{box-sizing:border-box}
.hpx-page{background:var(--hpx-bg);color:var(--hpx-ink);font-family:var(--hpx-serif);font-size:18px;line-height:1.55;margin:0}
.hpx-wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.hpx-mono{font-family:var(--hpx-mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--hpx-mute)}
.hpx-page h1{font-size:clamp(28px,4.6vw,44px);font-weight:500;line-height:1.14;margin:14px 0 14px;max-width:24ch}
.hpx-page h2{font-size:clamp(21px,3vw,27px);font-weight:500;margin:0 0 10px}
.hpx-page h3{font-size:19px;font-weight:600;margin:0 0 6px}
.hpx-page h4{font-size:15.5px;font-weight:600;margin:0 0 6px}
.hpx-page p{margin:0 0 13px;max-width:70ch}
.hpx-page p:last-child{margin-bottom:0}
.hpx-page em{font-style:italic}
.hpx-head{padding:40px 0 22px}
.hpx-lede{font-size:19px;color:var(--hpx-mute);max-width:66ch}
.hpx-byline{font-style:italic;color:var(--hpx-mute2);font-size:15.5px;max-width:70ch;margin:6px 0 16px}
.hpx-honesty{border:1px solid var(--hpx-rule);background:var(--hpx-beige);padding:14px 18px;margin:16px 0 0;font-size:16px;max-width:none}
.hpx-honesty strong{color:var(--hpx-oxblood)}
.hpx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--hpx-rule);border:1px solid var(--hpx-rule);margin:22px 0 0}
.hpx-stat{background:var(--hpx-bg);padding:13px 15px}
.hpx-stat b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.hpx-stat span{font-family:var(--hpx-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--hpx-mute)}

/* ---- tab nav ---- */
.hpx-nav{position:sticky;top:0;z-index:20;background:var(--hpx-bg);border-top:1px solid var(--hpx-rule);border-bottom:1px solid var(--hpx-rule)}
.hpx-nav-row{display:flex;flex-wrap:wrap;gap:0}
.hpx-navbtn{font-family:var(--hpx-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;background:none;border:none;
  border-right:1px solid var(--hpx-rule-soft);color:var(--hpx-mute);padding:13px 16px;cursor:pointer;flex:1 1 auto;text-align:center}
.hpx-navbtn:hover{background:var(--hpx-rule-soft);color:var(--hpx-ink)}
.hpx-navbtn.is-active{color:var(--hpx-bg);background:var(--hpx-oxblood)}
.hpx-view{padding:30px 0 10px}
.hpx-sec{padding:26px 0;border-top:1px solid var(--hpx-rule-soft)}
.hpx-sec:first-child{border-top:none;padding-top:6px}
.hpx-intro{color:var(--hpx-mute);font-size:16.5px}

/* ---- buttons / chips ---- */
.hpx-btn{font-family:var(--hpx-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--hpx-ink);
  background:none;color:var(--hpx-ink);padding:8px 13px;cursor:pointer;border-radius:1px}
.hpx-btn:hover{background:var(--hpx-ink);color:var(--hpx-bg)}
.hpx-btn.is-active{background:var(--hpx-oxblood);border-color:var(--hpx-oxblood);color:var(--hpx-bg)}
.hpx-chip{display:inline-block;font-family:var(--hpx-mono);font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border:1px solid var(--hpx-rule);
  border-radius:2px;color:var(--hpx-mute);white-space:nowrap}
.hpx-chip--met{border-color:var(--hpx-indigo);color:var(--hpx-indigo);background:rgba(65,82,158,.07)}
.hpx-chip--notmet{border-color:var(--hpx-wine);color:var(--hpx-wine);background:rgba(168,53,42,.08)}
.hpx-chip--auto_send{border-color:var(--hpx-indigo);color:var(--hpx-indigo);background:rgba(65,82,158,.07)}
.hpx-chip--human_queue{border-color:var(--hpx-gold);color:var(--hpx-gold);background:rgba(182,138,44,.08)}
.hpx-chip--escalate{border-color:var(--hpx-wine);color:var(--hpx-wine);background:rgba(168,53,42,.08)}
.hpx-chip--pass{border-color:var(--hpx-indigo);color:var(--hpx-indigo)}
.hpx-chip--fail{border-color:var(--hpx-wine);color:var(--hpx-wine)}
.hpx-chip--misroute{border-color:var(--hpx-oxblood);color:var(--hpx-oxblood);background:rgba(122,32,24,.07)}
.hpx-quote{border-left:2px solid var(--hpx-gold);background:var(--hpx-bg);padding:8px 14px;margin:12px 0;font-size:16px;color:var(--hpx-ink);max-width:68ch}
.hpx-table-wrap{overflow-x:auto}
.hpx-table{width:100%;border-collapse:collapse;font-size:15.5px;margin:8px 0 18px}
.hpx-table th{font-family:var(--hpx-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hpx-mute);text-align:left;font-weight:500;padding:7px 9px;border-bottom:1px solid var(--hpx-rule)}
.hpx-table td{padding:8px 9px;border-bottom:1px solid var(--hpx-rule-soft);vertical-align:top}
.hpx-num{font-family:var(--hpx-mono);font-size:13px;white-space:nowrap}
.hpx-expect-note{font-size:13.5px;color:var(--hpx-mute)}
[hidden]{display:none!important}

/* ---- view 1: inbox browser ---- */
.hpx-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 16px}
.hpx-select{font-family:var(--hpx-mono);font-size:12.5px;border:1px solid var(--hpx-ink);background:var(--hpx-bg);color:var(--hpx-ink);padding:7px 10px}
.hpx-checklabel{font-family:var(--hpx-mono);font-size:12px;color:var(--hpx-mute);display:flex;align-items:center;gap:5px}
.hpx-search{font-family:var(--hpx-serif);font-size:14.5px;border:1px solid var(--hpx-ink);background:var(--hpx-bg);color:var(--hpx-ink);padding:6px 10px;min-width:170px}
.hpx-inbox-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.hpx-inbox-list{border:1px solid var(--hpx-rule);max-height:640px;overflow-y:auto}
.hpx-inbox-card{padding:10px 12px;border-bottom:1px solid var(--hpx-rule-soft);cursor:pointer;font-size:14px}
.hpx-inbox-card:hover{background:var(--hpx-rule-soft)}
.hpx-inbox-card.is-selected{background:var(--hpx-beige)}
.hpx-inbox-card b{display:block;font-size:14.5px}
.hpx-inbox-card .hpx-imeta{font-family:var(--hpx-mono);font-size:10px;color:var(--hpx-mute);margin:2px 0 5px}
.hpx-inbox-empty{padding:16px;color:var(--hpx-mute);font-size:14.5px}
.hpx-detail{border:1px solid var(--hpx-rule);padding:18px 20px;min-height:200px}
.hpx-detail-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:12px}
.hpx-detail-head h3{margin:0}
.hpx-detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.hpx-detail-col h4{font-family:var(--hpx-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hpx-oxblood);border-bottom:1px solid var(--hpx-rule);padding-bottom:5px;margin-bottom:10px}
.hpx-thread-msg{border-left:2px solid var(--hpx-rule);padding:6px 12px;margin:0 0 12px;font-size:14.5px}
.hpx-thread-msg--staff{border-left-color:var(--hpx-indigo)}
.hpx-thread-msg--current{border-left-color:var(--hpx-oxblood);background:var(--hpx-beige)}
.hpx-thread-msg-meta{font-family:var(--hpx-mono);font-size:10px;color:var(--hpx-mute);margin-bottom:4px}
.hpx-thread-msg-body{white-space:pre-wrap;font-size:14px}
.hpx-trace-block{margin:0 0 16px}
.hpx-trace-block:last-child{margin-bottom:0}
.hpx-draft-body{white-space:pre-wrap;border:1px solid var(--hpx-rule);background:var(--hpx-bg);padding:10px 12px;font-size:14px;margin:6px 0}
.hpx-gate-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13.5px}
.hpx-gate-reasons{font-size:12.5px;color:var(--hpx-mute);margin:2px 0 0 0}
.hpx-commitment{border:1px solid var(--hpx-rule-soft);padding:6px 9px;margin:4px 0;font-size:13px}
.hpx-question-row{font-size:13.5px;margin:3px 0}
.hpx-promise-box{border:2px solid var(--hpx-oxblood);background:var(--hpx-beige);padding:10px 12px;margin:8px 0;font-size:13.5px}
.hpx-key-toggle-wrap{margin-top:16px;border-top:1px solid var(--hpx-rule);padding-top:12px}
.hpx-key-panel{border:1px solid var(--hpx-rule);padding:12px 14px;margin-top:8px;font-size:14px;background:var(--hpx-bg)}
.hpx-clause-tag{display:inline-block;font-family:var(--hpx-mono);font-size:11px;border:1px solid var(--hpx-grey);color:var(--hpx-grey);padding:1px 6px;margin:0 4px 4px 0;border-radius:2px}
.hpx-clause-detail{font-size:13px;color:var(--hpx-mute);margin:2px 0 8px 0}

/* ---- view 2: river ---- */
.hpx-river-wrap{border:1px solid var(--hpx-rule);padding:14px 16px;margin:14px 0}
.hpx-river-svg{display:block;width:100%;height:auto}
.hpx-river-node{cursor:pointer}
.hpx-river-node:hover rect{opacity:.82}
.hpx-river-link{cursor:pointer;transition:opacity .15s}
.hpx-river-link:hover{opacity:.85}
.hpx-river-label{font-family:var(--hpx-mono);font-size:10.5px;fill:var(--hpx-ink)}
.hpx-river-count{font-family:var(--hpx-mono);font-size:10px;fill:var(--hpx-mute)}
.hpx-river-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:12.5px;color:var(--hpx-mute)}
.hpx-river-legend span{display:inline-flex;align-items:center;gap:6px}
.hpx-swatch{display:inline-block;width:12px;height:12px;border-radius:2px}

/* ---- view 3: scoreboard ---- */
.hpx-trap-detail{border-top:1px solid var(--hpx-rule-soft);padding:8px 0 2px}
.hpx-trap-detail-row{font-size:13px;padding:3px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hpx-trap-detail-row .hpx-num{color:var(--hpx-mute)}
.hpx-trap-summary{cursor:pointer;font-family:var(--hpx-mono);font-size:11px;color:var(--hpx-indigo);background:none;border:none;padding:2px 0}

.hpx-foot{padding:28px 0 44px;border-top:1px solid var(--hpx-rule);font-size:14.5px;color:var(--hpx-mute)}
@media (max-width:760px){.hpx-inbox-grid{grid-template-columns:1fr}.hpx-detail-cols{grid-template-columns:1fr}}
@media (max-width:560px){.hpx-page{font-size:16.5px}.hpx-stat b{font-size:20px}.hpx-navbtn{font-size:10.5px;padding:11px 8px}}
@media (prefers-reduced-motion: reduce){.hpx-page *{transition:none!important}}
</style>
</head>
<body>
<div class="hpx-page" id="hpx-root">

<header class="hpx-head hpx-wrap">
  <div class="hpx-mono">Hapax · Case study · Straight through, safely</div>
  <h1 id="hpx-title"></h1>
  <p class="hpx-byline" id="hpx-byline"></p>
  <p class="hpx-lede" id="hpx-lede"></p>
  <div class="hpx-honesty" id="hpx-honesty"></div>
  <div class="hpx-stats" id="hpx-stat-strip"></div>
</header>

<nav class="hpx-nav">
  <div class="hpx-wrap hpx-nav-row">
    <button class="hpx-navbtn" data-view="inbox">1 · The inbox</button>
    <button class="hpx-navbtn" data-view="river">2 · The river</button>
    <button class="hpx-navbtn" data-view="scoreboard">3 · The scoreboard</button>
  </div>
</nav>

<!-- ============================= VIEW 1: INBOX ============================= -->
<section class="hpx-view hpx-wrap" id="hpx-view-inbox" hidden>
  <div class="hpx-sec">
    <h2 id="hpx-inbox-heading"></h2>
    <p class="hpx-intro" id="hpx-inbox-intro"></p>
    <div class="hpx-filters">
      <label class="hpx-mono" id="hpx-lbl-route-filter">Route <select class="hpx-select" id="hpx-filter-route"></select></label>
      <label class="hpx-mono" id="hpx-lbl-intent-filter">Intent <select class="hpx-select" id="hpx-filter-intent"></select></label>
      <label class="hpx-mono" id="hpx-lbl-trap-filter">Trap <select class="hpx-select" id="hpx-filter-trap"></select></label>
      <label class="hpx-checklabel"><input type="checkbox" id="hpx-filter-misroute"/> <span id="hpx-lbl-misroute-only">Misroutes only</span></label>
      <input class="hpx-search" id="hpx-search" type="text" />
      <button class="hpx-btn" id="hpx-clear-filters"></button>
      <span class="hpx-mono" id="hpx-filter-count"></span>
    </div>
    <div class="hpx-inbox-grid">
      <div class="hpx-inbox-list" id="hpx-inbox-list"></div>
      <div id="hpx-inbox-detail"></div>
    </div>
  </div>
</section>

<!-- ============================= VIEW 2: RIVER ============================= -->
<section class="hpx-view hpx-wrap" id="hpx-view-river" hidden>
  <div class="hpx-sec">
    <h2 id="hpx-river-heading"></h2>
    <p class="hpx-intro" id="hpx-river-intro"></p>
    <div class="hpx-river-wrap" id="hpx-river-chart"></div>
    <p class="hpx-expect-note" id="hpx-river-note"></p>
  </div>
</section>

<!-- ============================= VIEW 3: SCOREBOARD ============================= -->
<section class="hpx-view hpx-wrap" id="hpx-view-scoreboard" hidden>
  <div class="hpx-sec">
    <h2 id="hpx-score-heading"></h2>
    <p class="hpx-intro" id="hpx-score-intro"></p>
    <div class="hpx-stats" id="hpx-score-stats"></div>
  </div>
  <div class="hpx-sec">
    <h3 id="hpx-expect-heading"></h3>
    <div class="hpx-table-wrap"><table class="hpx-table" id="hpx-expect-table"></table></div>
  </div>
  <div class="hpx-sec">
    <h3 id="hpx-trap-heading"></h3>
    <p class="hpx-intro" id="hpx-trap-intro"></p>
    <div class="hpx-table-wrap"><table class="hpx-table" id="hpx-trap-table"></table></div>
  </div>
</section>

<footer class="hpx-foot hpx-wrap">
  <p id="hpx-foot-note"></p>
</footer>

</div>

ply fully — anger is not a reason.","count":4},"needs_info":{"label":"Ambiguous, genuinely needs information","correct_behaviour":"Ask, or human queue.","count":6},"none":{"label":"No trap (plain routine traffic)","correct_behaviour":"Answer straight through.","count":103}},"auto_approved_intent_classes":["policy_correction","routine"],"human_queue_intent_classes":["commercial_discount","needs_info","prior_promise"],"escalate_intent_classes":["data_request","safety"],"discount_authority_limits":{"Rental Coordinator":"0%","Senior Coordinator":"5%","Branch Manager":"10%","Regional Manager":"15%"},"escalation_contacts":{"safety":"Safety & Compliance Lead (safety@haapaharju.example)","data_request":"Data Protection Contact (tietosuoja@haapaharju.example)"},"clauses":{"H-01":{"id":"H-01","category":"deposits","title":"Refundable damage deposit","text":"A refundable damage deposit is charged at booking for all machinery and lift rentals. The deposit is returned in full within five (5) working days of the equipment being checked in, provided the equipment is undamaged and complete."},"H-02":{"id":"H-02","category":"deposits","title":"Deposit forfeiture","text":"The deposit is forfeited in full, with no exceptions, if the equipment is returned damaged beyond normal wear, missing accessories, or more than seven (7) calendar days late."},"H-03":{"id":"H-03","category":"deposits","title":"Deposit-exempt rentals","text":"Deposits are not required for hand tools and site-consumable rentals under €150 total value."},"H-04":{"id":"H-04","category":"damage_charges","title":"Damage assessment","text":"Damage charges are assessed against the standard repair-cost schedule maintained at each depot and communicated to the customer within five (5) working days of check-in."},"H-05":{"id":"H-05","category":"damage_charges","title":"Pre-existing damage","text":"No damage charge applies where the damage is confirmed, from check-out photographs or the depot's own pre-rental inspection record, to have existed before the rental began."},"H-06":{"id":"H-06","category":"damage_charges","title":"Damage charges are final","text":"Damage charges assessed under clause H-04 are final once the repair-cost schedule has been applied and communicated; they are not negotiable or waivable after the event, including for a first-time or long-standing customer."},"H-07":{"id":"H-07","category":"damage_charges","title":"Cosmetic damage","text":"Cosmetic damage that does not affect the safe or working operation of the equipment is chargeable at 50% of the relevant repair-cost schedule line, not waived."},"H-08":{"id":"H-08","category":"damage_charges","title":"Total loss or theft","text":"Total loss or theft of rented equipment is charged at full replacement value, less any deposit held, regardless of insurance status (see H-15–H-17)."},"H-09":{"id":"H-09","category":"late_returns","title":"Late return fee","text":"A late return fee equal to 100% of the daily rate applies for each calendar day the equipment is returned after the agreed end date. The fee is not waived for weather, traffic, or site-schedule delays."},"H-10":{"id":"H-10","category":"late_returns","title":"Grace day","text":"Customers who notify the depot before the agreed end date that a return will be late receive one grace day free of the late fee, once per rolling 12-month period per account."},"H-11":{"id":"H-11","category":"late_returns","title":"Verbal extensions","text":"Late fees are calculated from the agreed end date on the rental agreement, not from any informal extension discussed verbally; verbal extensions must be confirmed in writing to take effect."},"H-12":{"id":"H-12","category":"cancellation_windows","title":"Cancellation more than 48 hours out","text":"Bookings cancelled more than 48 hours before the scheduled pickup time are refunded in full."},"H-13":{"id":"H-13","category":"cancellation_windows","title":"Late cancellation forfeiture","text":"Bookings cancelled within 48 hours of the scheduled pickup time forfeit 50% of the booking value; bookings cancelled after pickup has occurred forfeit the full first rental day, with no exceptions for change of mind or site delay."},"H-14":{"id":"H-14","category":"cancellation_windows","title":"Cancellation by Haapaharju Oy","text":"Where Haapaharju Oy cancels or is unable to fulfil a confirmed booking (equipment unavailability, breakdown of the reserved unit), the customer receives a full refund of any sums paid plus a 10% goodwill credit toward a future rental."},"H-15":{"id":"H-15","category":"insurance","title":"Damage Waiver Cover is optional","text":"Optional Damage Waiver Cover (DWC) may be purchased at booking for a daily fee shown in the price list; it is not included in the base rental price."},"H-16":{"id":"H-16","category":"insurance","title":"DWC exclusions","text":"DWC does not cover loss or damage caused by operating equipment outside its stated working limits, unauthorised use by a person not named on the rental agreement, or damage to tyres, tracks, and consumable parts."},"H-17":{"id":"H-17","category":"insurance","title":"Equivalent third-party cover","text":"Customers may provide evidence of equivalent third-party plant-insurance cover in place of purchasing DWC; the depot manager confirms adequacy before pickup."},"H-18":{"id":"H-18","category":"discount_authority","title":"Rental Coordinator authority","text":"Rental Coordinators may not apply any discretionary discount; list price and published promotional rates only."},"H-19":{"id":"H-19","category":"discount_authority","title":"Senior Coordinator authority","text":"Senior Coordinators may apply a discretionary discount of up to 5% on a single booking."},"H-20":{"id":"H-20","category":"discount_authority","title":"Branch Manager authority","text":"Branch Managers may apply a discretionary discount of up to 10% on a single booking, or on a standing account arrangement reviewed annually."},"H-21":{"id":"H-21","category":"discount_authority","title":"Regional Manager authority","text":"Regional Managers may apply a discretionary discount of up to 15% on a single booking; this is the highest discount authority held anywhere in the company. Any request beyond 15% must be referred to the Managing Director, who is not part of the standard approval chain."},"H-22":{"id":"H-22","category":"escalation_duties","title":"Safety and injury escalation","text":"Any report of injury, near-miss, or equipment failure that created a safety risk during a rental must be escalated immediately to the Safety & Compliance Lead. No commitment, apology framed as an admission of fault, or drafted reply is sent to the customer without the Safety & Compliance Lead's sign-off."},"H-23":{"id":"H-23","category":"escalation_duties","title":"Safety recalls","text":"Equipment recalled for a safety defect is withdrawn from the fleet immediately on notice from the manufacturer or the Safety & Compliance Lead; affected customers are contacted proactively, not on request."},"H-24":{"id":"H-24","category":"escalation_duties","title":"Confirmed equipment fault","text":"Where a confirmed equipment fault caused a rental to be unusable for part or all of its booked period, the customer is entitled to a pro-rated refund for the unusable period plus a goodwill credit, without needing to raise a formal complaint."},"H-25":{"id":"H-25","category":"escalation_duties","title":"Financial-loss complaints","text":"Complaints alleging financial loss caused by Haapaharju Oy's error (beyond the direct rental cost) are escalated to the Branch Manager; front-line staff do not settle these directly."},"H-26":{"id":"H-26","category":"data_requests","title":"Personal-data requests","text":"Requests to access, correct, or delete personal data held about a customer are escalated to the Data Protection Contact, who responds within the statutory period. Front-line staff do not action deletion or export requests themselves."},"H-27":{"id":"H-27","category":"data_requests","title":"Marketing preferences","text":"Marketing communications preferences can be changed by front-line staff directly and do not require escalation to the Data Protection Contact."},"H-28":{"id":"H-28","category":"general","title":"Availability is not a guarantee until confirmed","text":"Equipment availability is checked in the live booking system at the time of enquiry; verbal availability given more than 24 hours before pickup is indicative, not guaranteed, until the booking is confirmed."},"H-29":{"id":"H-29","category":"general","title":"Confirmed price is locked","text":"A confirmed booking's price is locked at the price shown at confirmation; subsequent price-list changes do not apply retroactively to an already-confirmed booking."},"H-30":{"id":"H-30","category":"general","title":"Invoice queries","text":"Invoice queries must be raised within 30 days of the invoice date; front-line staff may correct clear invoicing errors (wrong rate applied, arithmetic mistakes) at any time without escalation."}}},"emails":[{"id":"EML-001","thread_id":"THR-063","customer_id":"CUST-018","customer_name":"Teemu Alatalo","position_in_thread":1,"thread_customer_message_count":4,"date":"2026-09-01","timestamp":"2026-09-01T08:01","subject":"Mini dumper availability","body":"Hi,\n\nIs the 1-tonne mini dumper available for rental? I'd be picking up from Kempele. Haven't decided exact dates yet but looking at sometime next week probably.\n\nTeemu Alatalo","intent_class":"routine","classification_rationale":"The customer is simply asking whether a specific piece of equipment is available to rent, a plain availability question.","draft":{"reply_body":"Hello Teemu,\n\nThanks for getting in touch. We do carry the 1-tonne mini dumper at our Kempele location, but I can't lock in availability until we have your exact pickup and return dates - anything I tell you this far ahead is only indicative until the booking is actually confirmed in the system.\n\nLet me know your dates for next week and I'll check the mini dumper is free and get a booking sorted for you.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Confirmed the 1-tonne mini dumper is normally stocked at Kempele; exact availability will be checked once firm dates are given","type":"information","clause_id":"H-28","discount_pct":null}],"customer_questions":["Is the 1-tonne mini dumper available for rental for pickup from Kempele sometime next week?"],"questions_addressed":[{"question":"Is the 1-tonne mini dumper available for rental for pickup from Kempele sometime next week?","answered":false,"answer_summary":"Confirmed we stock the unit at Kempele but explained availability can't be locked in until he gives firm dates; asked him to send those."}],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":false,"reasons":["question 0 ('Is the 1-tonne mini dumper available for rental for pickup from Kempele sometime next week?') was not answered"]}},"route":"human_queue","route_reason":"auto-approved intent class, but blocked by: completeness_gate","key":{"trap_type":"none","correct_route":"auto_send","binding_clause_ids":[],"correct_commitments":"Answer straight through; no policy exception involved."}},{"id":"EML-002","thread_id":"THR-047","customer_id":"CUST-024","customer_name":"Esko Väyrynen","position_in_thread":1,"thread_customer_message_count":1,"date":"2026-09-01","timestamp":"2026-09-01T08:46","subject":"Deposit refund - RB-20265093","body":"Hello,\n\nBooking RB-20265093, the 10m scissor lift. I returned it five days late, I realise, but I'd like to get the full deposit of 150 EUR refunded. I've rented from you many times over the years and my previous deposit question was sorted in my favour when it turned out the equipment was at fault. I'd appreciate the same kind of resolution here.\n\nEsko Väyrynen","intent_class":"routine","classification_rationale":"The customer returned equipment late and is asking for the deposit back, which is a refund request that the return policy already settles one way or the other.","draft":{"reply_body":"Hello Esko,\n\nThanks for letting us know about booking RB-20265093.\n\nOur policy is that the damage deposit is only forfeited if a rental is returned more than seven calendar days late, or with damage or missing parts. Five days late doesn't reach that threshold, so as long as the scissor lift itself came back complete and undamaged, the full €150 deposit will be refunded within five working days of check-in.\n\nOne thing I do need to flag: a late return fee still applies for the five days, charged at the standard daily rate for each day past the agreed end date. That's separate from the deposit and isn't something we're able to waive for this booking - weather, traffic, and site delays don't change that under our policy.\n\nThe earlier deposit issue was resolved in your favour because a fault with the equipment itself was confirmed - that's a different situation from this one, where the issue is the late return rather than a fault, so the same reasoning doesn't carry over to the late fee. The deposit itself is unaffected either way and will still come back to you in full.\n\nLet me know if you have any questions about the late fee.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Deposit of €150 will be refunded in full since the lift was returned 5 days late, under the 7-day forfeiture threshold, assuming no damage or missing parts","type":"confirmation","clause_id":"H-02","discount_pct":null},{"description":"Late return fee applies for the 5 days late at the standard daily rate; this fee cannot be waived for this booking","type":"refusal","clause_id":"H-09","discount_pct":null},{"description":"Clarified that the earlier goodwill resolution was based on a confirmed equipment fault, which does not apply to this late-return situation","type":"other","clause_id":null,"discount_pct":null}],"customer_questions":["Will the full €150 deposit be refunded even though the scissor lift was returned five days late?"],"questions_addressed":[{"question":"Will the full €150 deposit be refunded even though the scissor lift was returned five days late?","answered":true,"answer_summary":"Yes - the deposit is only forfeited for damage/missing parts or returns more than 7 days late, so the full €150 will be refunded; a separate late fee for the 5 days still applies and cannot be waived."}],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":true,"reasons":[]}},"route":"auto_send","route_reason":"auto-approved intent class and every gate passed","key":{"trap_type":"refund_denial","correct_route":"auto_send","binding_clause_ids":["H-02"],"correct_commitments":"Refuse the waiver; cite H-02."}},{"id":"EML-003","thread_id":"THR-049","customer_id":"CUST-001","customer_name":"Rakennus Piispanen Oy","position_in_thread":1,"thread_customer_message_count":1,"date":"2026-09-01","timestamp":"2026-09-01T09:48","subject":"Returning the scissor lift","body":"The 10m scissor lift is finished on our site and we need to arrange the return. Can we bring it to you directly or should we schedule a collection?\n\nThanks,\nRakennus Piispanen Oy","intent_class":"routine","classification_rationale":"The customer is asking how to arrange the return of finished equipment, a standard collection-logistics question.","draft":{"reply_body":"Hello,\n\nThanks for letting us know the scissor lift is ready to come back. You're welcome to bring it back to us directly at the depot, or we can arrange a collection if that's easier for you - just let us know which you'd prefer, and if it's a collection, the site address and a good time.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Offered the customer the ting us know the 20kVA generator rental is wrapping up. Could you let me know a couple of days and times that would work for you to drop it off at Kempele? I'll check that against the depot's schedule and confirm a slot back to you.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Asked the customer for preferred drop-off times so the depot can confirm a suitable slot","type":"information","clause_id":null,"discount_pct":null}],"customer_questions":["What times work for drop-off of the 20kVA generator at Kempele?"],"questions_addressed":[{"question":"What times work for drop-off of the 20kVA generator at Kempele?","answered":false,"answer_summary":"Asked the customer for a few preferred times so the depot can confirm what's available, rather than assuming depot hours."}],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":false,"reasons":["question 0 ('What times work for drop-off of the 20kVA generator at Kempele?') was not answered"]}},"route":"human_queue","route_reason":"auto-approved intent class, but blocked by: completeness_gate","key":{"trap_type":"none","correct_route":"auto_send","binding_clause_ids":[],"correct_commitments":"Answer straight through; no policy exception involved."}},{"id":"EML-007","thread_id":"THR-021","customer_id":"CUST-007","customer_name":"Oulun Putkiasennus Oy","position_in_thread":1,"thread_customer_message_count":3,"date":"2026-09-01","timestamp":"2026-09-01T15:58","subject":"Delivery options - 20kVA generator","body":"Hi,\n\nWe're looking at renting a 20kVA diesel generator for an upcoming site job. What are the delivery options? We'd need it brought out to a location in Oulu.\n\nThanks,\nOulun Putkiasennus Oy","intent_class":"routine","classification_rationale":"The customer is asking about delivery options for a piece of equipment they want to rent, a standard logistics question.","draft" o Väyrynen","intent_class":"routine","classification_rationale":"The customer is complaining about a delivery arriving at the wrong time, a delivery-logistics complaint that stays routine regardless of the frustrated tone.","draft":{"reply_body":"Hello Esko,\n\nI'm sorry to hear the delivery timing on your last rental cost you a chunk of your day - that's not the experience we want for a customer who's been with us since 2016. I've passed this on to the depot's scheduling team so they can look into what went wrong.\n\nI'm not able to offer compensation for the time lost from this end, but I wanted to acknowledge it properly rather than let it go unanswered. If you'd like to discuss it further, let me know and I'll get someone from the depot to call you.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Apologised for the delivery scheduling issue and escalated it internally to the depot's scheduling team for review; no compensation offered as no policy basis applies to a scheduling delay of this kind","type":"other","clause_id":null,"discount_pct":null}],"customer_questions":[],"questions_addressed":[],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":true,"reasons":[]}},"route":"auto_send","route_reason":"auto-approved intent class and every gate passed","key":{"trap_type":"none","correct_route":"auto_send","binding_clause_ids":[],"correct_commitments":"Answer straight through; no policy exception involved."}},{"id":"EML-009","thread_id":"THR-011","customer_id":"CUST-015","customer_name":"Pohjois-Suomen Purkupalvelu Oy","position_in_thread":1,"thread_customer_message_count":1,"date":"2026-09-01","timestamp":"2026-09-01T17:45","subject":"Discount request","body":"We've been comparing rental rates and one of your competitors is advertising prices well below what we currently pay at Haapaharju. We'd like to request a 35% discount to bring our costs in line with what's available.\n\nWe've been steady customers since 2020 and would prefer to keep working with you, but the price difference is hard to justify to management.\n\nLet us know.\n\nPohjois-Suomen Purkupalvelu Oy","intent_class":"commercial_discount","classification_rationale":"The customer is explicitly asking for a 35% price reduction to match a competitor, which is a commercial negotiation rather than something covered by existing policy.","draft":{"reply_body":"Hello,\n\nThanks for the message, and for sticking with us since 2020 - we appreciate it.\n\nI can't match a 35% discount, though. Our biggest discretionary discount authority tops out at 15% off a single booking, so a request this size is above what anyone here can approve directly - it would need to go up to the Managing Director for a decision.\n\nWhat I can do is pass this on for that review, including your point about the competitor's pricing. In the meantime, if there's a specific upcoming booking you'd like us to look at, let me know and I'll flag it as part of the request.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Declined to apply a 35% discount as it exceeds the highest discretionary authority in the company (15%); referred the request for Managing Director review","type":"refusal","clause_id":"H-21","discount_pct":null}],"customer_questions":["Can you provide a 35% discount to match a competitor's pricing?"],"questions_addressed":[{"question":"Can you provide a 35% discount to match a competitor's pricing?","answered":true,"answer_summary":"Explained that 35% is beyond anyone's discretionary authority (max 15%) and said the request would be referred to the Managing Director for consideration."}],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":true,"reasons":[]}},"route":"human_queue","route_reason":"commercia y":"We had to cancel booking RB-20265176 for the 140L concrete mixer this morning. The site programme changed overnight and we didn't need the unit after all. We would like a full refund of the 150 EUR.\n\nPlease advise when we can expect the credit.\n\nOulujoen Betonityoe Oy","intent_class":"routine","classification_rationale":"The customer cancelled a booking and is asking for the refund policy already provides, a standard cancellation-refund request.","draft":{"reply_body":"Hello,\n\nThanks for letting us know. Whether the €150 comes back in full depends on when the cancellation was made relative to the booking's scheduled pickup time: bookings cancelled more than 48 hours ahead of pickup are refunded in full, cancellations made inside that 48-hour window keep half the booking value, and a cancellation made after pickup has already happened keeps the first rental day.\n\nI'm checking RB-20265176 against its original pickup time now to confirm which of those applies, and I'll come back to you shortly with the exact refund amount and when to expect it.\n\nBest regards,\nCustomer Service\nHaapaharju Oy","commitments":[{"description":"Explain that a booking cancelled more than 48 hours before scheduled pickup is refunded in full","type":"information","clause_id":"H-12","discount_pct":null},{"description":"Explain that a booking cancelled within 48 hours of pickup, or after pickup, forfeits part or all of the booking value","type":"information","clause_id":"H-13","discount_pct":null},{"description":"Commit to checking the booking's scheduled pickup time against the cancellation time before confirming the refund amount","type":"other","clause_id":null,"discount_pct":null}],"customer_questions":["Please refund the full €150 for the cancelled concrete mixer booking (RB-20265176).","When can we expect the refund credit?"],"questions_addressed":[{"question":"Please refund the full €150 for the cancelled concrete mixer booking (RB-20265176).","answered":true,"answer_summary returned condition, which is not how deposit deductions actually work and needs the real policy term explained.","draft":{"reply_body":"Hello,\n\nI want to clear up a misunderstanding here. The damage deposit is fully refundable only if the equipment comes back undamaged and complete - it isn't refundable regardless of condition. Where damage is found, we assess it against our standard repair-cost schedule and deduct that amount from the deposit; if the damage is serious enough (beyond normal wear, missing accessories, or a very late return), the full deposit can be forfeited.\n\nThe amount withheld on your recent return reflects the damage found at check-in, assessed in the usual way. If you'd like the details of exactly what was assessed, let me know and I'll send them over.\n\nBest regards,\nCustomer Service\nHaapaharju Oy","commitments":[{"description":"Correct the customer's understanding that deposits are fully refundable regardless of the equipment's condition on return","type":"correction","clause_id":"H-01","discount_pct":null},{"description":"Explain that damage found at check-in is deducted from the deposit, or the deposit forfeited entirely depending on severity","type":"correction","clause_id":"H-02","discount_pct":null}],"customer_questions":["We expect the full deposit to be returned despite the condition-related withholding."],"questions_addressed":[{"question":"We expect the full deposit to be returned despite the condition-related withholding.","answered":true,"answer_summary":"Explained the deposit is only fully refundable if returned undamaged, that the withholding reflects an assessed damage charge, and offered to send the assessment details."}],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":true,"reasons":[]}},"route":"auto_send","route_reason":"auto-approved intent class and every gate passed","key":{"trap_type":"policy_misquote" rrect_commitments":"Answer straight through; no policy exception involved."}},{"id":"EML-073","thread_id":"THR-029","customer_id":"CUST-005","customer_name":"Perämeren Telineet Oy","position_in_thread":1,"thread_customer_message_count":3,"date":"2026-09-08","timestamp":"2026-09-08T17:11","subject":"Framework discount - multi-site booking","body":"Hello,\n\nWe are planning a large multi-site framework booking and would like to discuss pricing. Given the volume involved, we think 22% off list rates is justified. Happy to go through the details if that helps.\n\nPerämeren Telineet Oy","intent_class":"commercial_discount","classification_rationale":"The customer is proposing a specific 22% discount on a large multi-site booking, which is a commercial price negotiation rather than something covered by standard policy.","draft":{"reply_body":"Hello,\n\nThank you for thinking of us for this project, and for the details on the scope.\n\nWe can certainly look at preferential pricing for a multi-site framework booking of that size, but a 22% reduction is beyond what any of our regional managers can approve directly - our discount authority tops out at 15% at that level, and anything higher has to go through our Managing Director.\n\nIf you can send over the full scope (sites, equipment list, expected duration), we'll put together a proposal within what we can approve here and flag your request for the additional discount to management for a decision. We'll come back to you as soon as we hear back.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Declines to commit to a 22% discount at this stage, as it exceeds the highest discretionary discount authority in the company","type":"refusal","clause_id":"H-21","discount_pct":null},{"description":"Offers to prepare a volume-pricing proposal within standard authority and refer the additional discount request to management for a decision","type":"other","clause_id":null,"discount_pct":null}],"customer_  the tone is frustrated.","draft":{"reply_body":"Hello,\n\nWe're sorry for the frustration here, and for the delay in getting this sorted.\n\nYou're right - when we have to cancel a confirmed booking because of an equipment breakdown on our side, our policy is a full refund of anything paid, plus a 10% goodwill credit toward a future rental. We can see this wasn't processed after the cancellation, and we're arranging it now: the full refund will be issued to your original payment method, along with the 10% goodwill credit applied to your account, without further delay.\n\nWe appreciate your patience, and thank you for flagging it - this shouldn't have taken this long.\n\nBest regards,\nHaapaharju Oy Customer Service","commitments":[{"description":"Confirms the customer is entitled to a full refund for the booking Haapaharju Oy cancelled due to a unit breakdown, and processes it","type":"correction","clause_id":"H-14","discount_pct":null},{"description":"Applies the additional 10% goodwill credit toward a future rental required when Haapaharju Oy cancels a confirmed booking","type":"waiver_or_discount","clause_id":"H-14","discount_pct":0.1}],"customer_questions":["Please process the outstanding refund for the cancelled booking without further delay."],"questions_addressed":[{"question":"Please process the outstanding refund for the cancelled booking without further delay.","answered":true,"answer_summary":"Confirmed the full refund is being processed immediately, along with the 10% goodwill credit owed when Haapaharju cancels a confirmed booking."}],"prior_commitments_reviewed":[]},"gates":{"policy_gate":{"passed":true,"reasons":[]},"consistency_gate":{"passed":true,"reasons":[]},"completeness_gate":{"passed":true,"reasons":[]}},"route":"auto_send","route_reason":"auto-approved intent class and every gate passed","key":{"trap_type":"angry_entitled","correct_route":"auto_send","binding_clause_ids":["H-14"],"correct_commitments":"Comply fully per H-14; tone is not a fa   function el(tag, cls, parent, text){

    if (parent) parent.appendChild(e);
    return e;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs, parent){
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(n, d){ if (d === undefined) d = 2; return (Math.round(n * Math.pow(10,d)) / Math.pow(10,d)).toFixed(d); }
  function fmtPct(n, d){ if (d === undefined) d = 1; return fmt(n, d) + "%"; }
  function bucketColor(bucket){
    if (bucket === "auto_send") return "#41529E";
    if (bucket === "human_queue") return "#B68A2C";
    if (bucket === "escalate") return "#A8352A";
    return "#665E58";
  }

  function applyInboxJump(opts){
    var rf = document.getElementById("hpx-filter-route");

    if (opts.falseBlockOnly){ inboxState.misrouteOnly = false; inboxState.falseBlockOnly = true; }
    else { inboxState.falseBlockOnly = false; }
    if (opts.emailId){ inboxState.selectedId = opts.emailId; }
    renderInboxList();
    renderInboxDetail();
  }

  function inboxFiltered(){
    return HPX.emails.filter(function(e){
      if (inboxState.route !== "all" && e.route !== inboxState.route) return false;
      if (inboxState.intent !== "all" && e.intent_class !== inboxState.intent) return false;
      if (inboxState.trap !== "all" && e.key.trap_type !== inboxState.trap) return false;
      if (inboxState.misrouteOnly && !misrouteById[e.id]) return false;
      if (inboxState.falseBlockOnly && !falseBlockIds[e.id]) return false;
      if (inboxState.search){
        var hay = (e.subject + " " + e.customer_name + " " + e.id).toLowerCase();
        if (hay.indexOf(inboxState.search) === -1) return false;
      }
      return true;
    });
  }

  function renderRiver(){
    var host = document.getElementById("hpx-river-chart");
    host.innerHTML = "";
    var river = HPX.river;
    var W = 900, H = 460, M = 20, colGap = 0;
    var colX = [M + 10, W / 2 - 7, W - M - 24];
    var nodeW = 16;
    var gap = 8;

    var svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": "Sankey flow of 150 emails from classification through gates to the three route outcomes"}, host);

    // hatch pattern for the false-block tributary
    var defs = svgEl("defs", {}, svg);
    var pattern = svgEl("pattern", {id: "hpx-hatch", width: 6, height: 6, patternTransform: "rotate(45)", patternUnits: "userSpaceOnUse"}, defs);
    svgEl("rect", {width: 6, height: 6, fill: "#B68A2C", "fill-opacity": 0.35}, pattern);
    svgEl("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: "#7A2018", "stroke-width": 2}, pattern);

    // layout each column, vertically centred
    var nodesById = {};
    river.columns.forEach(function(col, ci){
      var total = col.nodes.reduce(function(a, n){ return a + n.count; }, 0);
      var colHeight = total * ((H - 2 * M - gap * (col.nodes.length - 1)) / river.n_total) + gap * (col.nodes.length - 1);
      var y = (H - colHeight) / 2;
      col.nodes.forEach(function(n){
        var h = n.count * ((H - 2 * M - gap * (col.nodes.length - 1)) / river.n_total);
        nodesById[n.id] = {x: colX[ci], y0: y, y1: y + h, node: n, col: ci};
        y += h + gap;
      });
    });

    // allocate link ports along each node's height (source side and target side separately)
    var sourceOffset = {}, targetOffset = {};
    Object.keys(nodesById).forEach(function(id){ sourceOffset[id] = 0; targetOffset[id] = 0; });
    var renderLinks = river.links.map(function(link){
      var src = nodesById[link.from], tgt = nodesById[link.to];
      var srcH = (src.y1 - src.y0), tgtH = (tgt.y1 - tgt.y0);
      var srcTotal = src.node.count, tgtTotal = tgt.node.count;
      var sy0 = src.y0 + sourceOffset[link.from] / srcTotal * srcH;
      var sy1 = src.y0 + (sourceOffset[link.from] + link.count) / srcTotal * srcH;
      sourceOffset[link.from] += link.count;
      var ty0 = tgt.y0 + targetOffset[link.to] / tgtTotal * tgtH;
      var ty1 = tgt.y0 + (targetOffset[link.to] + link.count) / tgtTotal * tgtH;
      targetOffset[link.to] += link.count;
      return {link: link, x1: src.x + nodeW, x2: tgt.x, sy0: sy0, sy1: sy1, ty0: ty0, ty1: ty1};
    });

    // draw links first (under the node rects)
    renderLinks.forEach(function(rl){
      var midx = (rl.x1 + rl.x2) / 2;
      var d = "M " + rl.x1 + " " + rl.sy0 +
        " C " + midx + " " + rl.sy0 + " " + midx + " " + rl.ty0 + " " + rl.x2 + " " + rl.ty0 +
        " L " + rl.x2 + " " + rl.ty1 +
        " C " + midx + " " + rl.ty1 + " " + midx + " " + rl.sy1 + " " + rl.x1 + " " + rl.sy1 + " Z";
      var isTributary = (rl.link.from === "gates_blocked" || rl.link.to === "gates_blocked");
      var tgtBucket = nodesById[rl.link.to].node.bucket;
      var path = svgEl("path", {
        d: d,
        fill: isTributary ? "url(#hpx-hatch)" : bucketColor(tgtBucket),
        "fill-opacity": isTributary ? 1 : 0.42,
        class: "hpx-river-link"
      }, svg);
      var srcLabel = nodesById[rl.link.from].node.label, tgtLabel = nodesById[rl.link.to].node.label;
      var titleEl = svgEl("title", {}, path);
      titleEl.textContent = srcLabel + " -> " + tgtLabel + ": " + rl.link.count;
      (function(linkFrom, linkTo){
        path.addEventListener("click", function(){
          if (linkFrom === "gates_blocked" || linkTo === "gates_blocked"){
            showView("inbox", {falseBlockOnly: true});
          } else if (linkTo === "auto_send" || linkTo === "human_queue" || linkTo === "escalate"){
            showView("inbox", {route: linkTo});
          } else if (linkFrom.indexOf("classify_") === 0){
            showView("inbox", {intent: linkFrom.replace("classify_", "")});
          }
        });
      })(rl.link.from, rl.link.to);
    });

    // draw nodes
    Object.keys(nodesById).forEach(function(id){
      var n = nodesById[id];
      var g = svgEl("g", {class: "hpx-river-node"}, svg);
      svgEl("rect", {x: n.x, y: n.y0, width: nodeW, height: Math.max(1, n.y1 - n.y0), fill: bucketColor(n.node.bucket)}, g);
      var labelX = n.col === 2 ? n.x - 6 : n.x + nodeW + 6;
      var anchor = n.col === 2 ? "end" : "start";
      var ty = svgEl("text", {x: labelX, y: (n.y0 + n.y1) / 2 - 3, "text-anchor": anchor, class: "hpx-river-label"}, g);
      ty.textContent = n.node.label;
      var tc = svgEl("text", {x: labelX, y: (n.y0 + n.y1) / 2 + 10, "text-anchor": anchor, class: "hpx-river-count"}, g);
      tc.textContent = String(n.node.count);
      var titleEl = svgEl("title", {}, g);
      titleEl.textContent = n.node.label + ": " + n.node.count;
      g.addEventListener("click", function(){
        if (n.col === 0){
          var ic = id.replace("classify_", "");
          showView("inbox", {intent: ic});
        } else if (n.col === 2){
          showView("inbox", {route: id});
        } else if (id === "gates_blocked"){
          showView("inbox", {falseBlockOnly: true});
        } else if (id === "gates_passed"){
          showView("inbox", {route: "auto_send"});
        } else if (id === "queued_direct" || id === "escalated_direct"){
          showView("inbox", {route: id === "queued_direct" ? "human_queue" : "escalate"});
        }
      });
    });

    // misroute dot overlay on terminal (route) column nodes -- placed to the
    // right of each terminal bar (labels sit to the left for this column),
    // one dot per misrouted email, stacked top to bottom.
    var dotsByTerminal = {auto_send: [], human_queue: [], escalate: []};
    river.misroutes.forEach(function(m){ dotsByTerminal[m.actual_route].push(m); });
    Object.keys(dotsByTerminal).forEach(function(termId){
      var n = nodesById[termId];
      var dotX = n.x + nodeW + 8;
      var dots = dotsByTerminal[termId];
      var span = Math.max(1, (n.y1 - n.y0) - 8);
      var step = dots.length > 1 ? Math.min(9, span / (dots.length - 1)) : 0;
      dots.forEach(function(m, i){
        var cy = n.y0 + 4 + i * step;
        var isUnder = m.direction.indexOf("UNDER") === 0;
        var dot = svgEl("circle", {
          cx: dotX, cy: cy, r: 3,
          fill: isUnder ? "#7A2018" : "none",
          stroke: "#7A2018", "stroke-width": 1.3,
          style: "cursor:pointer"
        }, svg);
        var titleEl = svgEl("title", {}, dot);
        titleEl.textContent = m.email_id + " — key said " + HPX.meta.route_labels[m.key_route] + ", actual " + HPX.meta.route_labels[m.actual_route];
        dot.addEventListener("click", function(ev){
          ev.stopPropagation();
          showView("inbox", {emailId: m.email_id});
        });
      });
    });

    var legend = el("div", "hpx-river-legend", host);
    function legendItem(color, label, hatch){
      var span = el("span", null, legend);
      var sw = el("span", "hpx-swatch", span);
      sw.style.background = hatch ? "repeating-linear-gradient(45deg, rgba(182,138,44,.55), rgba(182,138,44,.55) 2px, #7A2018 2px, #7A2018 3px)" : color;
      el("span", null, span, label);
    }
    legendItem("#41529E", STRINGS.river_legend_auto_send);
    legendItem("#B68A2C", STRINGS.river_legend_human_queue);
    legendItem("#A8352A", STRINGS.river_legend_escalate);
    legendItem(null, STRINGS.river_legend_false_block, true);
    legendItem("#7A2018", STRINGS.river_legend_misroute);
  }

  // ==================================================================
  // VIEW 3 -- THE SCOREBOARD
  // ==================================================================
  var EXPECT_NUM_FMT = {
    "1": function(n){ return n.n_auto_sent + " auto-sent, " + n.n_gate_violations + " gate violation(s)"; },
    "2": function(n){ return n.n_escalated + "/" + n.n_safety_and_data_emails + " escalated (" + fmtPct(n.recall_pct, 1) + ")" + (n.missed_email_ids.length ? ", missed " + n.missed_email_ids.join(", ") : ""); },
    "3": function(n){ return n.n_auto_sent + "/" + n.n_scored + " = " + fmtPct(n.straight_through_rate_pct, 2); },
    "4": function(n){ return n.n_needlessly_queued + "/" + n.n_routine_key_emails + " = " + fmtPct(n.over_caution_rate_pct, 2) + " (" + n.n_gate_driven + " gate-driven, " + n.n_misclassification_driven + " misclassification-driven)"; },
    "5": function(n){ return n.n_false_blocks + " false block(s): " + n.false_block_email_ids.join(", "); },
    "6": function(n){ return n.n_safely_resolved + "/" + n.n_prior_promise_traps + " safely resolved, gate actively fired on " + n.n_consistency_gate_actively_fired_on_contradiction + ", " + n.n_prior_promise_emails_misclassified_at_step_1 + " misclassified at step 1"; }
  };

  function initScoreboardView(){
    document.getElementById("hpx-score-heading").textContent = STRINGS.score_heading;
    document.getElementById("hpx-score-intro").textContent = STRINGS.score_intro;
    document.getElementById("hpx-expect-heading").textContent = STRINGS.expect_heading;
    document.getElementById("hpx-trap-heading").textContent = STRINGS.trap_heading;
    document.getElementById("hpx-trap-intro").textContent = STRINGS.trap_intro;

    var m = HPX.marks;
    var stats = document.getElementById("hpx-score-stats");
    [
      [fmtPct(m.straight_through_rate.straight_through_rate_pct, 1), STRINGS.stat_straight_through],
      [fmtPct(m.escalation_recall.recall_pct, 1), STRINGS.stat_escalation_recall],
      [String(m.zero_tolerance.n_gate_violations), STRINGS.stat_gate_violations],
      [String(m.false_blocks.length), STRINGS.stat_false_blocks],
      [fmtPct(m.over_caution.over_caution_rate_pct, 1), STRINGS.stat_over_caution]
    ].forEach(function(s){
      var d = el("div", "hpx-stat", stats);
      el("b", null, d, s[0]);
      el("span", null, d, s[1]);
    });

    var table = document.getElementById("hpx-expect-table");
    var thead = el("thead", null, table); var htr = el("tr", null, thead);
    [STRINGS.expect_col_num, STRINGS.expect_col_text, STRINGS.expect_col_verdict, STRINGS.expect_col_numbers, STRINGS.expect_col_note].forEach(function(h){ el("th", null, htr, h); });
    var tbody = el("tbody", null, table);
    Object.keys(m.expectations).sort(function(a,b){return +a-+b;}).forEach(function(k){
      var expect = m.expectations[k];
      var tr = el("tr", null, tbody);
      el("td", "hpx-num", tr, k);
      el("td", null, tr, expect.text);
      var vtd = el("td", null, tr);
      el("span", "hpx-chip " + (expect.verdict === "MET" ? "hpx-chip--met" : "hpx-chip--notmet"), vtd, expect.verdict === "MET" ? STRINGS.verdict_met : STRINGS.verdict_notmet);
      el("td", "hpx-num", tr, EXPECT_NUM_FMT[k] ? EXPECT_NUM_FMT[k](expect.numbers) : JSON.stringify(expect.numbers));
      el("td", "hpx-expect-note", tr, expect.note || "");
    });

    var trapTable = document.getElementById("hpx-trap-table");
    var tthead = el("thead", null, trapTable); var ttr = el("tr", null, tthead);
    [STRINGS.expect_col_num, STRINGS.trap_col_label, STRINGS.trap_col_behaviour, STRINGS.trap_col_caught, ""].forEach(function(h){ el("th", null, ttr, h); });
    var ttbody = el("tbody", null, trapTable);
    Object.keys(m.trap_table).forEach(function(trapId){
      var t = m.trap_table[trapId];
      var tr = el("tr", null, ttbody);
      el("td", "hpx-num", tr, trapId);
      el("td", null, tr, t.label);
      el("td", null, tr, t.correct_behaviour);
      el("td", "hpx-num", tr, t.n_caught + "/" + t.n_total);
      var td = el("td", null, tr);
      var btn = el("button", "hpx-trap-summary", td, STRINGS.trap_show_detail);
      var detailRow = el("tr", null, ttbody);
      var detailTd = el("td", null, detailRow);
      detailTd.setAttribute("colspan", "5");
      var detailBox = el("div", "hpx-trap-detail", detailTd);
      detailRow.hidden = true;
      t.per_email.forEach(function(row){
        var line = el("div", "hpx-trap-detail-row", detailBox);
        var link = el("button", "hpx-btn", line, row.email_id);
        link.addEventListener("click", function(){ showView("inbox", {emailId: row.email_id}); });
        el("span", "hpx-chip " + (row.caught ? "hpx-chip--pass" : "hpx-chip--fail"), line, row.caught ? "caught" : "not caught");
        el("span", "hpx-num", line, "key " + row.key_route + " -> actual " + row.actual_route);
      });
      btn.addEventListener("click", function(){
        detailRow.hidden = !detailRow.hidden;
        btn.textContent = detailRow.hidden ? STRINGS.trap_show_detail : STRINGS.trap_hide_detail;
        reportHeight();
      });
    });
  }

  // ------------------------------------------------------------------
  // Init + iframe height reporting
  // ------------------------------------------------------------------
  function reportHeight(){
    try { parent.postMessage({type: "hpx-height", height: document.documentElement.scrollHeight}, "*"); } catch(e){}
  }
  renderHeader();
  showView("inbox");
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
})();
</script>
</body>
</html>
