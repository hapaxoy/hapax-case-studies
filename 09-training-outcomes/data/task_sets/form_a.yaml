form: A
tasks:
- task_id: A1
  index: 1
  category: instruction_reliability
  prompt: 'Kuusiharju''s site-supply team gets a short email from a supplier every
    time a delivery is confirmed. Write a single instruction you could hand an AI
    assistant so that, given any one of these emails, it always returns the same three-line
    summary in the same order: delivery date, item and quantity, and any change from
    the original order. Running your instruction twice on the same email must produce
    the same three lines both times. State the instruction, then explain in one sentence
    what part of it forces that repeat-consistency.'
  max_points: 4
  rubric_items:
  - item_id: A1.1
    description: names a concrete consistency mechanism (fixed line count, a template,
      a stated field order — not just 'be consistent')
    item_difficulty: 0.15
    points: 1
  - item_id: A1.2
    description: the instruction is unambiguous about what counts as one of the three
      lines
    item_difficulty: 0.35
    points: 1
  - item_id: A1.3
    description: the instruction specifies what to do when the input is missing one
      of the three fields
    item_difficulty: 0.6
    points: 1
  - item_id: A1.4
    description: the one-sentence explanation correctly names why the instruction
      constrains the output, not just what a good summary looks like
    item_difficulty: 0.85
    points: 1
- task_id: A2
  index: 2
  category: instruction_reliability
  prompt: Write an instruction for turning a week's worth of expense-claim lines (date,
    amount, category, submitter) into a standard approval memo. Two different colleagues,
    given the same week's claims and your instruction, should produce memos with the
    same structure and the same total — even though the wording may differ.
  max_points: 4
  rubric_items:
  - item_id: A2.1
    description: specifies the exact output structure (fields and their order), not
      just 'a memo'/'a list'
    item_difficulty: 0.2
    points: 1
  - item_id: A2.2
    description: specifies how the total or count is derived, not just that it should
      appear
    item_difficulty: 0.45
    points: 1
  - item_id: A2.3
    description: addresses at least one ambiguous or duplicate-looking input line
      explicitly
    item_difficulty: 0.65
    points: 1
  - item_id: A2.4
    description: the instruction would genuinely survive being run by two different
      people without a shared example in front of them
    item_difficulty: 0.9
    points: 1
- task_id: A3
  index: 3
  category: error_spotting
  prompt: 'An AI assistant drafted this email to a client:


    "Thanks for your patience. Following our call on the 14th, we can confirm the
    revised delivery date of the 19th, three days out from today. The unit price stays
    at €48.50 as quoted, for a total of €4,850 on the 100-unit order."


    Find the planted error, state exactly where it sits in the text, and say what
    you would check to confirm it before the email goes out.'
  max_points: 4
  rubric_items:
  - item_id: A3.1
    description: identifies that an error exists at all rather than accepting the
      text at face value
    item_difficulty: 0.15
    points: 1
  - item_id: A3.2
    description: 'locates the specific error correctly — a date-arithmetic mismatch
      between two figures both stated in the SAME form''s own text (Form A: ''19th''
      is 5 days from the 14th, not the stated ''three days out''; Form B: an 8am start
      plus a ''roughly six hours'' job finishes the same day, the 22nd, not the stated
      ''23rd'') — a response should name only its own form''s mismatch, never the
      other form''s numbers'
    item_difficulty: 0.4
    points: 1
  - item_id: A3.3
    description: states the error precisely (which two figures disagree) rather than
      a vague sense something is off
    item_difficulty: 0.6
    points: 1
  - item_id: A3.4
    description: names a concrete check against a source system rather than 'I would
      double-check it'
    item_difficulty: 0.8
    points: 1
- task_id: A4
  index: 4
  category: error_spotting
  prompt: 'An AI assistant drafted this section of a weekly ops report:


    "Deliveries this week: 62, up from 54 last week (a 15% increase). Of these, 3
    were late, giving an on-time rate of 97%. Stock of the fast-moving items held
    steady at 340 units across the two depots, 170 at each."


    Find both planted errors, state exactly where each sits, and say what you would
    check to confirm each before the report is sent up.'
  max_points: 4
  rubric_items:
  - item_id: A4.1
    description: 'engages seriously with the arithmetic on the form''s CLEAN figure
      — the one that checks out as stated (Form A: the 15% delivery-growth figure,
      54 to 62; Form B: the 92% on-time-rate figure, 9 late of 118) — credited even
      if the response finds nothing else, provided the check is real arithmetic and
      not just restating the figure'
    item_difficulty: 0.2
    points: 1
  - item_id: A4.2
    description: 'finds the form''s headline numeric error, which requires recomputing
      a stated percentage from its own two source figures (Form A: the on-time rate
      is stated as 97% but 3 late of 62 is ~95%; Form B: the growth rate is stated
      as 20% but 96 to 118 is ~23%) — a response should name only its own form''s
      error, never the other form''s figures'
    item_difficulty: 0.45
    points: 1
  - item_id: A4.3
    description: 'finds the shared structural error: the summary claims a total ''held
      steady'' (170+170=340 in A, 29,000+29,000=58,000 in B — the addition itself
      is correct in both) while the same paragraph reports the underlying activity
      rising sharply, an unexplained contradiction the internally-consistent sum does
      not excuse'
    item_difficulty: 0.7
    points: 1
  - item_id: A4.4
    description: proposes checking against the underlying source records (the depot/regional
      ledgers) rather than re-deriving from the same summary text
    item_difficulty: 0.85
    points: 1
- task_id: A5
  index: 5
  category: checkability_judgment
  prompt: 'Two AI outputs answer the same question, "what were Q2 returns as a percentage
    of Q2 sales?":


    Output 1: "Q2 returns ran at 4.1% of sales."

    Output 2: "Q2 sales were €612,000 and returns were €25,100, so returns were 25,100
    / 612,000 = 4.1% of sales."


    Which output would you sign off, and why? What exactly makes the other one harder
    to check?'
  max_points: 4
  rubric_items:
  - item_id: A5.1
    description: correctly prefers the output that shows the source numbers and the
      calculation
    item_difficulty: 0.15
    points: 1
  - item_id: A5.2
    description: names specifically what is missing from the bare-number output (the
      two source figures), not just 'less detail'
    item_difficulty: 0.35
    points: 1
  - item_id: A5.3
    description: notes that the bare number could still be right but cannot be verified
      without re-running the query
    item_difficulty: 0.55
    points: 1
  - item_id: A5.4
    description: states what they would still want to check even on the fuller output
      (that the source figures themselves are correct)
    item_difficulty: 0.8
    points: 1
- task_id: A6
  index: 6
  category: checkability_judgment
  prompt: 'Two draft customer-service replies to a complaint about a late delivery:


    Reply 1 (confident): "We''re very sorry — this was entirely our error and it won''t
    happen again. We''ve applied a 10% credit to your account."

    Reply 2 (hedged): "Thanks for flagging this. Our records show the order (ref.
    4471) was dispatched two days after the confirmed date; we''ve applied a 10% credit
    (ref. CR-1182) to your account and are checking with the depot on the cause."


    Which would you send without further checking, and what would you check on the
    other one first?'
  max_points: 4
  rubric_items:
  - item_id: A6.1
    description: prefers the reply/email that cites a checkable reference (order number,
      ticket, PO log) over the confident-but-unsourced one
    item_difficulty: 0.2
    points: 1
  - item_id: A6.2
    description: names exactly what claim in the unsourced version cannot currently
      be checked
    item_difficulty: 0.4
    points: 1
  - item_id: A6.3
    description: does not simply reject the confident version outright — recognises
      it might be checked and then sent
    item_difficulty: 0.6
    points: 1
  - item_id: A6.4
    description: identifies a specific verification step to run before sending the
      unsourced version, not a general 'be careful'
    item_difficulty: 0.8
    points: 1
- task_id: A7
  index: 7
  category: data_handling_policy
  prompt: 'You want an AI chat tool''s help drafting a customer update. Kuusiharju
    has not vetted this particular tool for data handling. For each item below, say
    yes or no to pasting it in, with one line of reasoning:

    1. The customer''s delivery address

    2. This week''s total sales figure (aggregate, no customer detail)

    3. Next quarter''s unreleased pricing plan

    4. A product spec sheet already published on the company website

    5. A colleague''s personal mobile number, copied from an email signature'
  max_points: 4
  rubric_items:
  - item_id: A7.1
    description: correctly says no to the item containing identifiable personal data
      (item 1 in A, item 5 in B)
    item_difficulty: 0.15
    points: 1
  - item_id: A7.2
    description: correctly says no to the not-yet-released internal figure (item 3
      in both forms)
    item_difficulty: 0.35
    points: 1
  - item_id: A7.3
    description: correctly says yes to the already-public item (item 4 in both forms),
      not over-cautiously refusing it
    item_difficulty: 0.55
    points: 1
  - item_id: A7.4
    description: gives a reasoning line that names WHY (public already, personal data,
      competitively sensitive) rather than a bare yes/no
    item_difficulty: 0.75
    points: 1
- task_id: A8
  index: 8
  category: data_handling_policy
  prompt: 'A supplier contract needs summarising for an internal memo, and you want
    an AI tool''s help drafting the summary. The contract includes: the supplier''s
    company registration details, the agreed unit pricing and volume discounts, a
    confidentiality clause naming both parties, and the delivery schedule. Decide
    what you would paste in as-is, what you would redact first, and why.'
  max_points: 4
  rubric_items:
  - item_id: A8.1
    description: recognises the pricing/rate terms as sensitive and treats them deliberately
      (redact or confirm tool is vetted first), not pasted without thought
    item_difficulty: 0.2
    points: 1
  - item_id: A8.2
    description: recognises the confidentiality/NDA clause as a reason for particular
      caution given it names both parties
    item_difficulty: 0.45
    points: 1
  - item_id: A8.3
    description: identifies at least one part of the document that is low-risk to
      paste as-is (e.g. the general service scope) rather than over-redacting everything
    item_difficulty: 0.65
    points: 1
  - item_id: A8.4
    description: proposes a concrete alternative to pasting the sensitive parts (e.g.
      paraphrase without figures, or use a vetted internal tool) rather than just
      declining
    item_difficulty: 0.85
    points: 1
- task_id: A9
  index: 9
  category: verification_habit
  prompt: You now generate the weekly ops report with AI assistance. Describe the
    specific check you would build into that process — not "I'd read it over" but
    a named, repeatable step — and say exactly where in the weekly workflow it sits.
  max_points: 4
  rubric_items:
  - item_id: A9.1
    description: names a concrete, repeatable check (e.g. cross-cast the total against
      the source system, spot-check N random lines) rather than a vague intention
    item_difficulty: 0.2
    points: 1
  - item_id: A9.2
    description: the check is placed at a specific point in the workflow (before it
      reaches a named recipient, not just 'at some point')
    item_difficulty: 0.4
    points: 1
  - item_id: A9.3
    description: the check would actually catch a wrong total or a fabricated line,
      not just a typo
    item_difficulty: 0.65
    points: 1
  - item_id: A9.4
    description: names who is responsible for the check and what happens if it fails
      (a route back, not a dead end)
    item_difficulty: 0.85
    points: 1
- task_id: A10
  index: 10
  category: verification_habit
  prompt: 'Here is a multi-step AI-assisted workflow for processing incoming customer
    orders: (1) AI reads the incoming order email and extracts the item list and quantities;
    (2) AI checks stock availability against the warehouse system; (3) AI drafts a
    confirmation email with a delivery estimate; (4) the confirmation is sent automatically
    if stock is available. Identify the step most in need of a verification gate,
    and specify exactly what the gate should check.'
  max_points: 4
  rubric_items:
  - item_id: A10.1
    description: identifies the extraction step (1) as carrying risk that compounds
      downstream, not just the automatic-send step
    item_difficulty: 0.2
    points: 1
  - item_id: A10.2
    description: identifies the automatic-action step (4) as the point where an error
      becomes irreversible, and argues for a gate there specifically
    item_difficulty: 0.45
    points: 1
  - item_id: A10.3
    description: specifies a concrete check content (e.g. flag any extracted quantity/total
      above a threshold, or any stock/match level near the cutoff) rather than 'add
      a review step'
    item_difficulty: 0.65
    points: 1
  - item_id: A10.4
    description: addresses what happens on a gate failure (routes to a person, does
      not just block silently)
    item_difficulty: 0.85
    points: 1
