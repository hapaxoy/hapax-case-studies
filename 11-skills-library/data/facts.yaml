# Structured facts for the Tuomimetsä world (Project 11). Generated by code/build_world.py from config.py.
# One ID per fact. Held out of world/: the arm builders read world/ only. 'stale' marks schema comments that
# are out of date on purpose; trap_class is internal.
- id: DEF-NET-SALES
  kind: definition
  statement: Net sales is the net amount excluding VAT, after returns; a return reduces net sales on its own return date,
    not on the original sale date.
  must_contain:
  - excluding VAT
  - return date
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-NET-SALES-SCOPE
  kind: definition
  statement: Net sales exclude store 999 and test articles (category ZZ Test); they include staff purchases.
  must_contain:
  - '999'
  - ZZ Test
  - staff purchases
  docs:
  - metric_dictionary
  trap_class: exclusions
  parity_required: true
- id: DEF-WEB-RECOGNITION
  kind: definition
  statement: Web sales are recognised on the dispatch date in Helsinki time; sale_date on a web line is the order date and
    is not used for web net sales.
  must_contain:
  - dispatch date
  - Helsinki time
  docs:
  - metric_dictionary
  trap_class: time_zone
  parity_required: true
- id: DEF-WEB-CANCELLED
  kind: definition
  statement: Cancelled web orders are excluded from web sales and from web order counts.
  must_contain:
  - cancelled
  docs:
  - metric_dictionary
  trap_class: exclusions
  parity_required: true
- id: DEF-WEB-ORDER-COUNT
  kind: definition
  statement: Web orders are counted on the order date in Helsinki time; orders still processing are counted, cancelled orders
    are not.
  must_contain:
  - order date
  - processing
  docs:
  - metric_dictionary
  trap_class: time_zone
  parity_required: true
- id: DEF-CLICK-COLLECT
  kind: definition
  statement: Click-and-collect counts as web. The click-and-collect share is click-and-collect net sales divided by all web
    net sales.
  must_contain:
  - counted as web
  - click-and-collect share
  docs:
  - metric_dictionary
  trap_class: migration
  parity_required: true
- id: DEF-TIMEZONE
  kind: definition
  statement: Timestamps in the warehouse are UTC. Business reporting uses Helsinki time, with the day changing at local midnight.
  must_contain:
  - UTC
  - local midnight
  docs:
  - metric_dictionary
  trap_class: time_zone
  parity_required: true
- id: DEF-LFL-BASIS
  kind: definition
  statement: Like-for-like (LFL) growth compares net sales in the LFL stores for a period with the same fiscal weeks last
    year, week by week. Physical stores only; the web shop is not part of LFL.
  must_contain:
  - like-for-like
  - same fiscal weeks last year
  - web shop is not part of
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-LFL-OPEN
  kind: definition
  statement: A store is in the LFL base for a period only if it had been open at least 52 weeks (364 days) before the first
    day of the period.
  must_contain:
  - 52 weeks
  - first day of the period
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-LFL-BOTH-YEARS
  kind: definition
  statement: A store-week counts only if the store traded in that fiscal week in both years; a week in which the store was
    shut (refit or closure) in either year drops out for that store.
  must_contain:
  - both years
  - traded
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-LFL-REFIT
  kind: definition
  statement: Refit weeks are excluded for the store concerned, in both years, using ref_store_closure; the store stays in
    the base for its other weeks.
  must_contain:
  - refit weeks
  - ref_store_closure
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-LFL-WEEK53
  kind: definition
  statement: Week 53 is excluded from LFL because it has no comparator week.
  must_contain:
  - week 53
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: DEF-ATV
  kind: definition
  statement: 'Average transaction value (ATV) is net sales before returns divided by the number of sales receipts. It is a
    store measure: staff purchases, store 999 and test articles are excluded, and web orders are not included.'
  must_contain:
  - before returns
  - sales receipts
  - staff purchases
  - store 999
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-ACTIVE-MEMBER
  kind: definition
  statement: An active member has made at least one purchase in the trailing 52 fiscal weeks, ending with the as-of week and
    including it, through any channel. Count distinct member_id.
  must_contain:
  - 52 fiscal weeks
  - member_id
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-MEMBER-SHARE
  kind: definition
  statement: Member share of sales is net sales before returns on lines linked to a member divided by all net sales before
    returns; receipts without a member and guest web orders count as non-member.
  must_contain:
  - member share of sales
  - guest
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-RETURN-RATE
  kind: definition
  statement: Return rate is returned net (refund_net) divided by sold net, grouped by the fiscal week of the original sale
    (the sale-week cohort), whenever the return happened. This is deliberately a different date convention from net sales.
  must_contain:
  - sale-week cohort
  - original sale
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-GROSS-MARGIN
  kind: definition
  statement: 'Gross margin is net sales minus the standard cost of the goods sold, both after returns: returned units are
    credited back at standard cost. Margin percentage is gross margin divided by net sales.'
  must_contain:
  - standard cost
  - credited
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-WEEKS-COVER
  kind: definition
  statement: Weeks of cover is closing stock units at the end of a fiscal week divided by the average weekly units sold over
    the prior four fiscal weeks, at the same store or grouping. Units sold are the quantity on sales lines, by sale date.
  must_contain:
  - prior four fiscal weeks
  - closing stock
  docs:
  - metric_dictionary
  trap_class: semi_additive
  parity_required: true
- id: DEF-STOCK-SEMIADD
  kind: definition
  statement: Closing stock is a snapshot taken at the end of each fiscal week. Add it across stores and products but never
    across weeks; for a period, average the weekly closings or take the last week's, as the request asks.
  must_contain:
  - never across weeks
  - snapshot
  docs:
  - metric_dictionary
  trap_class: semi_additive
  parity_required: true
- id: DEF-UPLIFT
  kind: definition
  statement: Campaign uplift is the mean net sales per targeted member minus the mean per holdout member over the campaign
    window plus seven days. A targeted member has at least one exposure row in the campaign; members with no sales count as
    zero; net sales are before returns on lines linked to the member.
  must_contain:
  - plus seven days
  - holdout
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-HIERARCHY-ASIS
  kind: definition
  statement: Management reporting restates history on the current hierarchy (store region, product category), called as-is,
    unless the request asks for as-was, which is the hierarchy at the date of the transaction.
  must_contain:
  - as-is
  - as-was
  docs:
  - metric_dictionary
  trap_class: scd
  parity_required: true
- id: DEF-VAT-GROSS
  kind: definition
  statement: Net sales are always excluding VAT. Figures including VAT are summed from gross_amount on the lines, each at
    its own VAT rate; a flat rate is never applied to a net total.
  must_contain:
  - gross_amount
  - own VAT rate
  docs:
  - metric_dictionary
  trap_class: vat
  parity_required: true
- id: DEF-NEW-MEMBER
  kind: definition
  statement: A new member is counted on their join date, at the home store in their first dim_member version (the home store
    at enrolment). Online sign-ups sit under store 900.
  must_contain:
  - join date
  - first version
  docs:
  - metric_dictionary
  trap_class: company_definition
  parity_required: true
- id: DEF-STORE-LEAGUE
  kind: definition
  statement: 'The store league table ranks stores by net sales per trading day. Trading days are the days the store was open:
    after opening, before closure, outside refit closures and not a closed holiday. A store that traded for only part of the
    period is still listed, with its own trading days.'
  must_contain:
  - per trading day
  - closed holiday
  docs:
  - metric_dictionary
  trap_class: exclusions
  parity_required: true
- id: DEF-STORE-SCOPE
  kind: definition
  statement: Store counts and store-level analyses cover the physical stores only (store_id below 900). The web shop (store
    900) is shown as its own line when a request asks for the total company; store 999 is never included.
  must_contain:
  - below 900
  - total company
  docs:
  - metric_dictionary
  trap_class: exclusions
  parity_required: true
- id: CAL-YEAR
  kind: calendar
  statement: The fiscal year starts on the Monday nearest 1 May. Weeks run Monday to Sunday. Years are labelled like FY2025/26.
  must_contain:
  - Monday nearest 1 May
  - FY2025/26
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-FY-DATES
  kind: calendar
  statement: FY2024/25 runs 29 April 2024 to 27 April 2025 (52 weeks); FY2025/26 runs 28 April 2025 to 3 May 2026 (53 weeks);
    FY2026/27 starts 4 May 2026.
  must_contain:
  - 29 April 2024
  - 27 April 2025
  - 28 April 2025
  - 3 May 2026
  - 4 May 2026
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-PERIODS
  kind: calendar
  statement: 'A fiscal year has 12 periods in a 4-4-5 week pattern within each quarter. A quarter is three periods: Q1 is
    P1 to P3 (weeks 1 to 13), Q2 is P4 to P6, Q3 is P7 to P9, Q4 is P10 to P12.'
  must_contain:
  - 4-4-5
  - P1 to P3
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-WEEK53
  kind: calendar
  statement: FY2025/26 has 53 weeks. Week 53 (27 April 2026 to 3 May 2026) is added to period 12, which then has six weeks.
    Week 53 has no comparator week in the prior year.
  must_contain:
  - week 53
  - period 12
  - 27 April 2026
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-COMPARE
  kind: calendar
  statement: Compare with last year by the same fiscal week or period number (week-aligned), not by the same calendar dates.
  must_contain:
  - same fiscal week
  - calendar dates
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-RELATIVE
  kind: calendar
  statement: 'Relative terms: last period means the last completed fiscal period; year to date (YTD) means the fiscal year
    to date through the last completed fiscal week; this year means the current fiscal year.'
  must_contain:
  - last completed
  - year to date
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-DATA-THROUGH
  kind: calendar
  statement: The warehouse is loaded through Sunday 4 October 2026 (FY2026/27 week 22). Period 6 of FY2026/27 has only its
    first week; the last complete period is FY2026/27 P05, ending 27 September 2026.
  must_contain:
  - 4 October 2026
  - FY2026/27 P05
  - 27 September 2026
  docs:
  - metric_dictionary
  trap_class: fiscal_calendar
  parity_required: true
- id: CAL-CLOSED-DAYS
  kind: calendar
  statement: 'The stores are shut on: New Year''s Day, Epiphany, Good Friday, Easter Sunday, May Day, Midsummer Eve, Midsummer
    Day, Independence Day, Christmas Eve, Christmas Day, Boxing Day. dim_date.is_trading_day is false on those days.'
  must_contain:
  - is_trading_day
  - Midsummer Eve
  - Good Friday
  docs:
  - metric_dictionary
  trap_class: exclusions
  parity_required: true
- id: REG-MIGRATION
  kind: register
  statement: The web platform migrated on 3 November 2025. channel_code stops being filled from that date and channel_id is
    used instead; click-and-collect gets its own key (3). Before the migration click-and-collect orders carry channel_code
    WB and no channel_id.
  must_contain:
  - 3 November 2025
  - channel_id
  - channel_code
  docs:
  - data_quality_register
  trap_class: migration
  parity_required: true
- id: REG-LEGACY-VIEW
  kind: register
  statement: rpt.v_daily_sales is built on channel_code. From 3 November 2025 it silently omits web sales. rpt.v_weekly_store_sales
    is built on it and has the same gap. Do not use either.
  must_contain:
  - rpt.v_daily_sales
  - web sales
  - rpt.v_weekly_store_sales
  docs:
  - data_quality_register
  trap_class: migration
  parity_required: true
- id: REG-STORE-999
  kind: register
  statement: Store 999 is the training store. It holds test-article and staff-training transactions only and is excluded from
    all sales reporting.
  must_contain:
  - '999'
  - training store
  docs:
  - data_quality_register
  trap_class: exclusions
  parity_required: true
- id: REG-STORE-900
  kind: register
  statement: The web shop is a pseudo-store, store_id 900 (region Online, format Web), so that web lines and web returns have
    a store key. Web lines are told apart by store_id, not by channel_code.
  must_contain:
  - '900'
  - Online
  - pseudo-store
  docs:
  - data_quality_register
  trap_class: migration
  parity_required: true
- id: REG-STAFF-PURCHASE
  kind: register
  statement: staff_purchase_flag is set on every line of a staff receipt (staff get 15% off). Staff purchases count in net
    sales and are excluded from ATV.
  must_contain:
  - staff_purchase_flag
  docs:
  - data_quality_register
  trap_class: exclusions
  parity_required: true
- id: REG-UTC
  kind: register
  statement: Columns ending _ts_utc hold UTC. sale_date is the Helsinki business date of the sale. Finland is UTC+2 in winter
    and UTC+3 in summer; the clocks changed on 30 March 2025 and 26 October 2025, among other dates.
  must_contain:
  - _ts_utc
  - UTC+2
  - UTC+3
  docs:
  - data_quality_register
  trap_class: time_zone
  parity_required: true
- id: REG-CANCELLED
  kind: register
  statement: Cancelled web orders stay in fact_web_order with status cancelled, no dispatch time and no sales lines. Orders
    not yet dispatched have status processing and no sales lines until they are.
  must_contain:
  - cancelled
  - processing
  - no sales lines
  docs:
  - data_quality_register
  trap_class: exclusions
  parity_required: true
- id: REG-TEST-SKU
  kind: register
  statement: Test articles sit in category ZZ Test. They are sold in store 999 and in a few web test orders, and are excluded
    from all reporting.
  must_contain:
  - ZZ Test
  docs:
  - data_quality_register
  trap_class: exclusions
  parity_required: true
- id: REG-WEB-SALE-DATE
  kind: register
  statement: On web lines sale_date is the order date. The revenue date is the dispatch date, found by joining fact_web_order
    on receipt_id = web_order_id.
  must_contain:
  - order date
  - dispatch date
  - web_order_id
  docs:
  - data_quality_register
  trap_class: time_zone
  parity_required: true
- id: REG-REGION-REORG
  kind: register
  statement: 'On 28 April 2025 the four regions (South, West, East, North) became five, with the new Capital Region. 6 stores
    changed region: 101 Helsinki Vuosaari (South to Capital Region); 102 Helsinki Pitäjänmäki (South to Capital Region); 103
    Espoo Lommila (South to Capital Region); 104 Vantaa Tammisto (South to Capital Region); 105 Kerava (South to Capital Region);
    114 Kouvola (East to South).'
  must_contain:
  - 28 April 2025
  - Capital Region
  - '114'
  docs:
  - data_quality_register
  trap_class: scd
  parity_required: true
- id: REG-OUTDOOR-LIGHTING
  kind: register
  statement: From 27 October 2025 (FY2025/26 period 7) the outdoor lighting subcategory moved from Garden to Electrical. Each
    affected article has a new dim_product version from that date.
  must_contain:
  - 27 October 2025
  - outdoor lighting
  docs:
  - data_quality_register
  trap_class: scd
  parity_required: true
- id: REG-SCD-KEYS
  kind: register
  statement: dim_store, dim_product and dim_member keep one row per version. The fact tables carry the version key (store_key,
    product_key, member_key) valid on the transaction date. store_id, sku and member_id are stable across versions; count
    distinct natural keys, and join between versions only on the validity dates, or rows multiply.
  must_contain:
  - store_id
  - member_id
  - validity
  docs:
  - data_quality_register
  trap_class: scd
  parity_required: true
- id: REG-STORE-EVENTS
  kind: register
  statement: 'Store openings: Tampere Lamminpää (136), opened 2 September 2024; Lohja (137), opened 4 November 2024. Store
    closure: Savonlinna (129), closed 25 January 2026.'
  must_contain:
  - '136'
  - '137'
  - 25 January 2026
  docs:
  - data_quality_register
  trap_class: company_definition
  parity_required: true
- id: REG-REFITS
  kind: register
  statement: 'Refit closures, whole fiscal weeks with no sales: Vantaa Tammisto (104), 8 July 2024 to 11 August 2024 (5 weeks);
    Pori (119), 8 September 2025 to 12 October 2025 (5 weeks); Kuopio (125), 15 June 2026 to 26 July 2026 (6 weeks). They
    are listed in ref_store_closure.'
  must_contain:
  - ref_store_closure
  - '104'
  - '119'
  - '125'
  docs:
  - data_quality_register
  trap_class: company_definition
  parity_required: true
- id: REG-DEPRECATED
  kind: register
  statement: 'Do not use: dim_store_old and dim_product_old (flat, pre-history), every stg_ table (staging), every bak_ table
    (dated backups), every tmp_ table, rpt_weekly_sales_by_region (stopped refreshing 27 April 2025, old regions), rpt.v_daily_sales
    and rpt.v_weekly_store_sales.'
  must_contain:
  - dim_store_old
  - stg_
  - bak_
  - tmp_
  - rpt_weekly_sales_by_region
  docs:
  - data_quality_register
  trap_class: migration
  parity_required: true
- id: REG-CONTROL-TOTAL
  kind: register
  statement: rpt_daily_store_sales holds net sales per store per business day on the company definition (web on its dispatch
    date, returns on their return date). It has no product, member or channel dimension. Use it as a control total for store-level
    figures.
  must_contain:
  - rpt_daily_store_sales
  - control total
  docs:
  - data_quality_register
  trap_class: company_definition
  parity_required: true
- id: REG-MEMBER-VERSIONS
  kind: register
  statement: dim_member gets a new version when a member's tier, home store or marketing consent changes. Count members by
    distinct member_id; the member_key on a line is the version at that date.
  must_contain:
  - marketing consent
  - tier
  - distinct member_id
  docs:
  - data_quality_register
  trap_class: fan_out
  parity_required: true
- id: REG-EXPOSURE-FANOUT
  kind: register
  statement: fact_campaign_exposure has one row per contact, so a member can appear several times in one campaign. Reduce
    to one row per member (distinct member_id) before joining to sales.
  must_contain:
  - one row per contact
  - distinct member_id
  docs:
  - data_quality_register
  trap_class: fan_out
  parity_required: true
- id: REG-CONSENT
  kind: register
  statement: Members are contacted only if they have marketing consent on the contact date. Holdout members (10% of each mailing
    list) are never contacted. campaign_holdout holds member_id, not member_key.
  must_contain:
  - campaign_holdout
  - member_id, not member_key
  docs:
  - data_quality_register
  trap_class: fan_out
  parity_required: true
- id: REG-GUEST-ORDERS
  kind: register
  statement: Guest web orders (checkout without logging in) have no member key. Logged-in orders carry the member's key.
  must_contain:
  - guest
  - logged-in
  docs:
  - data_quality_register
  trap_class: company_definition
  parity_required: true
- id: REG-STOCK-SNAPSHOT
  kind: register
  statement: fact_stock_week has one row per store and article for each week-ending Sunday, only for the articles the store
    ranges (carries). Web orders are picked from the central warehouse, which is not in this table.
  must_contain:
  - ranges
  - central warehouse
  docs:
  - data_quality_register
  trap_class: semi_additive
  parity_required: true
- id: REG-RETURN-LAG
  kind: register
  statement: 'Returns can arrive up to 30 days after a sale, so a sale-week cohort is not complete until about five weeks
    later. Return lines are booked where they are processed: web returns sent by post are booked to the web shop.'
  must_contain:
  - 30 days
  - booked
  docs:
  - data_quality_register
  trap_class: company_definition
  parity_required: true
- id: REG-VAT-CHANGE
  kind: register
  statement: The general VAT rate rose from 24% to 25.5% on 1 September 2024. The reduced rates (14% and 10%) did not change.
    The rate is stored on each line; dim_product.vat_class says which rate applies.
  must_contain:
  - 25.5%
  - 1 September 2024
  - 14%
  - 10%
  docs:
  - data_quality_register
  trap_class: vat
  parity_required: true
- id: TEAM-ASIS
  kind: team_note
  statement: Report history as-is (current regions and categories restated back) unless the requester asks for as-was. Say
    which one you used.
  must_contain:
  - as-is
  - as-was
  docs:
  - team_notes
  trap_class: scd
  parity_required: true
- id: TEAM-EXPLICIT-REQUEST
  kind: team_note
  statement: When a request explicitly asks for something that differs from a company default (gross instead of net, as-was
    instead of as-is, UTC instead of Helsinki time, and so on), follow the request and say that you did.
  must_contain:
  - explicitly asks
  - follow the request
  docs:
  - team_notes
  trap_class: override
  parity_required: true
- id: TEAM-NO-LEGACY-VIEW
  kind: team_note
  statement: Do not use rpt.v_daily_sales. It loses web sales after the migration.
  must_contain:
  - rpt.v_daily_sales
  docs:
  - team_notes
  trap_class: migration
  parity_required: true
- id: TEAM-LFL-EDGE
  kind: team_note
  statement: 'LFL edge cases: a store back from a refit is excluded for the refit weeks only; the two new stores enter the
    LFL base on 1 September 2025 (136) and 3 November 2025 (137); the closed store (129) drops out from its closure; week
    53 is never LFL; the web shop is never LFL.'
  must_contain:
  - 1 September 2025
  - 3 November 2025
  - week 53
  docs:
  - team_notes
  trap_class: company_definition
  parity_required: true
- id: TEAM-EXCLUSIONS
  kind: team_note
  statement: Always filter out store 999 and category ZZ Test in sales work, and say so when the filter changes a total.
  must_contain:
  - '999'
  - ZZ Test
  docs:
  - team_notes
  trap_class: exclusions
  parity_required: true
- id: TEAM-CONTROL-TOTALS
  kind: team_note
  statement: Before sending a store-level figure, check the total against rpt_daily_store_sales for the same days.
  must_contain:
  - rpt_daily_store_sales
  docs:
  - team_notes
  trap_class: company_definition
  parity_required: true
- id: SCH-dim_date.calendar_date
  kind: schema
  statement: Calendar date
  must_contain: []
  docs:
  - schema_comments
  trap_class: none
  parity_required: false
  stale: false
- id: SCH-dim_date.day_of_week
  kind: schema
  statement: ISO weekday, 1 = Monday
  must_contain: []
  docs:
  - schema_comments
  trap_class: none
  parity_required: false
  stale: false
- id: SCH-dim_date.day_name
  kind: schema
  statement: Weekday name
  must_contain: []
  docs:
  - schema_comments
  trap_class: none
  parity_required: false
