<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>One applicant pool, four ways to read it – a Hapax case study</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --hpx-bg:#FBFAF5; --hpx-ink:#1A1410; --hpx-oxblood:#7A2018; --hpx-navy:#1F2A52;
  --hpx-wine:#A8352A; --hpx-indigo:#41529E; --hpx-gold:#B68A2C; --hpx-grey:#665E58; --hpx-beige:#EFE5CE;
  --hpx-mute:rgba(26,20,16,.62); --hpx-mute2:rgba(26,20,16,.42); --hpx-mute3:rgba(26,20,16,.22);
  --hpx-rule:rgba(26,20,16,.16); --hpx-rule-soft:rgba(26,20,16,.08);
  --hpx-serif:"Cormorant Garamond",Georgia,serif; --hpx-mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
.hpx-page,.hpx-page *,.hpx-page *::before,.hpx-page *::after{box-sizing:border-box}
.hpx-page{background:var(--hpx-bg);color:var(--hpx-ink);font-family:var(--hpx-serif);font-size:18px;line-height:1.55;margin:0}
.hpx-wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.hpx-mono{font-family:var(--hpx-mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--hpx-mute)}
.hpx-page h1{font-size:clamp(26px,4.4vw,42px);font-weight:500;line-height:1.16;margin:14px 0 14px;max-width:24ch}
.hpx-page h2{font-size:clamp(20px,2.8vw,26px);font-weight:500;margin:0 0 10px}
.hpx-page h3{font-size:19px;font-weight:600;margin:0 0 6px}
.hpx-page h4{font-size:15.5px;font-weight:600;margin:0 0 6px}
.hpx-page h5{font-family:var(--hpx-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--hpx-mute);margin:0 0 6px;font-weight:500}
.hpx-page p{margin:0 0 12px;max-width:none}
.hpx-page p:last-child{margin-bottom:0}
.hpx-page ul{margin:0 0 12px;padding-left:20px}
.hpx-page em{font-style:italic}
.hpx-head{padding:36px 0 20px}
.hpx-lede{font-size:18.5px;color:var(--hpx-mute);max-width:none}
.hpx-byline{font-style:italic;color:var(--hpx-mute2);font-size:15px;max-width:none;margin:6px 0 16px}
.hpx-honesty{border:1px solid var(--hpx-rule);background:var(--hpx-beige);padding:14px 18px;margin:16px 0 0;font-size:15.5px;max-width:none}
.hpx-honesty strong{color:var(--hpx-oxblood)}
.hpx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--hpx-rule);border:1px solid var(--hpx-rule);margin:20px 0 0}
.hpx-stat{background:var(--hpx-bg);padding:12px 14px}
.hpx-stat b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.hpx-stat span{font-family:var(--hpx-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--hpx-mute)}

/* ---- section rhythm ---- */
.hpx-sec{padding:26px 0;border-top:1px solid var(--hpx-rule-soft)}
.hpx-sec:first-child{border-top:none;padding-top:10px}
.hpx-intro{color:var(--hpx-mute);font-size:16px}
.hpx-view{padding:26px 0 10px}

/* ---- tab nav ---- */
.hpx-nav{position:sticky;top:0;z-index:20;background:var(--hpx-bg);border-top:1px solid var(--hpx-rule);border-bottom:1px solid var(--hpx-rule);margin-top:8px}
.hpx-nav-row{display:flex;flex-wrap:wrap;gap:0}
.hpx-navbtn{font-family:var(--hpx-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;background:none;border:none;
  border-right:1px solid var(--hpx-rule-soft);color:var(--hpx-mute);padding:13px 16px;cursor:pointer;flex:1 1 auto;text-align:center}
.hpx-navbtn:hover{background:var(--hpx-rule-soft);color:var(--hpx-ink)}
.hpx-navbtn.is-active{color:var(--hpx-bg);background:var(--hpx-oxblood)}

/* ---- buttons / chips ---- */
.hpx-btn{font-family:var(--hpx-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--hpx-ink);
  background:none;color:var(--hpx-ink);padding:8px 13px;cursor:pointer;border-radius:1px}
.hpx-btn:hover{background:var(--hpx-ink);color:var(--hpx-bg)}
.hpx-btn.is-active{background:var(--hpx-oxblood);border-color:var(--hpx-oxblood);color:var(--hpx-bg)}
.hpx-btn[disabled]{opacity:.4;cursor:default}
.hpx-btn[disabled]:hover{background:none;color:var(--hpx-ink)}
.hpx-chip{display:inline-block;font-family:var(--hpx-mono);font-size:10px;letter-spacing:.05em;padding:2px 8px;border:1px solid var(--hpx-rule);
  border-radius:2px;color:var(--hpx-mute);white-space:nowrap}
.hpx-chip--met{border-color:var(--hpx-indigo);color:var(--hpx-indigo);background:rgba(65,82,158,.07)}
.hpx-chip--caution{border-color:var(--hpx-gold);color:var(--hpx-gold);background:rgba(182,138,44,.08)}
.hpx-chip--flagged{border-color:var(--hpx-wine);color:var(--hpx-wine);background:rgba(168,53,42,.08)}
.hpx-chip--muted{border-color:var(--hpx-rule);color:var(--hpx-mute)}
.hpx-select{font-family:var(--hpx-mono);font-size:12.5px;border:1px solid var(--hpx-ink);background:var(--hpx-bg);color:var(--hpx-ink);padding:7px 10px;max-width:100%}
.hpx-table-wrap{overflow-x:auto}
.hpx-table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 18px}
.hpx-table th{font-family:var(--hpx-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--hpx-mute);text-align:left;font-weight:500;padding:7px 9px;border-bottom:1px solid var(--hpx-rule);cursor:pointer;white-space:nowrap}
.hpx-table th:hover{color:var(--hpx-ink)}
.hpx-table th.is-sorted{color:var(--hpx-oxblood)}
.hpx-table td{padding:7px 9px;border-bottom:1px solid var(--hpx-rule-soft);vertical-align:top}
.hpx-table tr.hpx-rowlink{cursor:pointer}
.hpx-table tr.hpx-rowlink:hover{background:var(--hpx-rule-soft)}
.hpx-num{font-family:var(--hpx-mono);font-size:13px;white-space:nowrap;text-align:right}
.hpx-quote{border-left:2px solid var(--hpx-gold);background:var(--hpx-bg);padding:7px 12px;margin:8px 0;font-size:15px;color:var(--hpx-ink);max-width:none}
.hpx-quote cite{display:block;margin-top:4px;font-family:var(--hpx-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--hpx-mute);font-style:normal}
.hpx-note{font-size:13.5px;color:var(--hpx-mute);font-style:italic;margin:6px 0 0}

/* ---- matched pair ---- */
.hpx-pair-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;margin:14px 0}
.hpx-pair-card{border:2px solid var(--hpx-rule);padding:16px 18px}
.hpx-pair-card.hpx-pair-card--gem{border-color:var(--hpx-indigo)}
.hpx-pair-card.hpx-pair-card--stuffer{border-color:var(--hpx-wine)}
.hpx-pair-tag{font-family:var(--hpx-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 4px;display:block}
.hpx-pair-card--gem .hpx-pair-tag{color:var(--hpx-indigo)}
.hpx-pair-card--stuffer .hpx-pair-tag{color:var(--hpx-wine)}
.hpx-pair-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--hpx-mute);margin:6px 0 12px}
.hpx-pair-meta b{color:var(--hpx-ink);font-family:var(--hpx-mono)}
.hpx-arm4row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hpx-rule);border:1px solid var(--hpx-rule);font-size:11px;margin:10px 0 4px}
.hpx-arm4row div{background:var(--hpx-bg);padding:6px 5px;font-family:var(--hpx-mono);text-align:center;text-transform:uppercase;letter-spacing:.04em;color:var(--hpx-mute)}
.hpx-req-detail{margin:0 0 10px}
.hpx-req-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hpx-req-name{font-size:15px;font-weight:600}
.hpx-arm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.hpx-arm-cell{border:1px solid var(--hpx-rule-soft);padding:6px 7px;font-size:12.5px;min-width:0}
.hpx-arm-cell .hpx-arm-label{display:block;font-family:var(--hpx-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--hpx-mute3);margin-bottom:3px}
.hpx-arm-cell p{font-size:12.5px;margin:3px 0 0;max-width:none}
.hpx-overcredit{border:1px solid var(--hpx-wine);background:rgba(168,53,42,.06);padding:10px 13px;font-size:14.5px;margin:10px 0 0}
.hpx-overcredit strong{color:var(--hpx-wine)}

/* ---- browser ---- */
.hpx-browse-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 16px}
.hpx-browse-count{font-family:var(--hpx-mono);font-size:12px;color:var(--hpx-mute)}
.hpx-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:800px){.hpx-detail-grid{grid-template-columns:1fr}}
.hpx-detail-col{border:1px solid var(--hpx-rule);padding:14px 16px;min-width:0}
.hpx-app-text{font-size:14.5px;max-height:520px;overflow-y:auto;padding-right:4px}
.hpx-app-text h4{margin:12px 0 4px}
.hpx-app-text h4:first-child{margin-top:0}
.hpx-app-text p{margin:0 0 8px}
.hpx-app-text ul{margin:0 0 8px;padding-left:18px}
.hpx-dossier-col{max-height:520px;overflow-y:auto;padding-right:4px}
.hpx-keypanel{border:1px solid var(--hpx-rule);background:var(--hpx-beige);padding:14px 16px;margin:14px 0 0}
.hpx-keypanel-row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--hpx-rule-soft);font-size:14px}
.hpx-keypanel-row:last-child{border-bottom:none}
.hpx-keypanel-req{font-weight:600;min-width:210px}
.hpx-demog-row{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--hpx-mute);margin:4px 0 10px}

/* ---- coverage ---- */
.hpx-order-label{font-family:var(--hpx-mono);font-size:12px;color:var(--hpx-mute);margin:0 0 8px}

/* ---- game ---- */
.hpx-game-box{border:1px solid var(--hpx-rule);padding:18px 20px}
.hpx-game-progress{font-family:var(--hpx-mono);font-size:12px;color:var(--hpx-mute);margin-bottom:10px}
.hpx-timer-wrap{margin:0 0 14px}
.hpx-timer-bar-track{height:6px;background:var(--hpx-rule-soft);border:1px solid var(--hpx-rule)}
.hpx-timer-bar-fill{height:100%;background:var(--hpx-oxblood);transition:width 1s linear}
.hpx-timer-num{font-family:var(--hpx-mono);font-size:13px;color:var(--hpx-mute);margin-top:4px;display:block}
.hpx-decision-row{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0;align-items:center}
.hpx-decision-row label{display:flex;align-items:center;gap:6px;font-family:var(--hpx-mono);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.hpx-recap-table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0 18px}
.hpx-recap-table td,.hpx-recap-table th{padding:8px 9px;border-bottom:1px solid var(--hpx-rule-soft)}
.hpx-recap-table th{font-family:var(--hpx-mono);font-size:10.5px;text-transform:uppercase;color:var(--hpx-mute);text-align:left}
.hpx-game-candidate-block{border-top:1px solid var(--hpx-rule-soft);padding:18px 0}
.hpx-game-candidate-block:first-child{border-top:none}
.hpx-role-tag{font-family:var(--hpx-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hpx-oxblood);display:block;margin-bottom:6px}
.hpx-match-yes{color:var(--hpx-indigo);font-family:var(--hpx-mono)}
.hpx-match-no{color:var(--hpx-wine);font-family:var(--hpx-mono)}
.hpx-match-na{color:var(--hpx-mute);font-family:var(--hpx-mono)}
.hpx-tally-strip{display:flex;flex-wrap:wrap;gap:1px;background:var(--hpx-rule);border:1px solid var(--hpx-rule);margin:14px 0}
.hpx-tally-strip div{background:var(--hpx-bg);padding:12px 14px;flex:1 1 160px}
.hpx-tally-strip b{display:block;font-size:20px;font-family:var(--hpx-mono)}
.hpx-tally-strip span{font-family:var(--hpx-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--hpx-mute)}

.hpx-foot{padding:26px 0 44px;border-top:1px solid var(--hpx-rule);font-size:14px;color:var(--hpx-mute)}
[hidden]{display:none!important}
@media (max-width:560px){
  .hpx-page{font-size:16.5px}
  .hpx-stat b{font-size:19px}
  .hpx-navbtn{font-size:10px;padding:11px 6px}
  .hpx-arm-grid,.hpx-arm4row{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){.hpx-page *{transition:none!important}}
</style>
</head>
<body>
<div class="hpx-page" id="hpx-root">

<header class="hpx-head hpx-wrap">
  <div class="hpx-mono">Hapax · Case study · Talent screening</div>
  <h1 id="hpx-title"></h1>
  <p class="hpx-byline" id="hpx-byline"></p>
  <p class="hpx-lede" id="hpx-lede"></p>
  <div class="hpx-honesty" id="hpx-honesty"></div>
  <div class="hpx-stats" id="hpx-stat-strip"></div>
</header>

<section class="hpx-wrap hpx-sec" id="hpx-matched-pair-section">
  <h2 id="hpx-pair-heading"></h2>
  <p class="hpx-intro" id="hpx-pair-intro"></p>
  <div class="hpx-pair-grid" id="hpx-pair-grid"></div>
</section>

<nav class="hpx-nav">
  <div class="hpx-wrap hpx-nav-row">
    <button class="hpx-navbtn" data-view="browser" id="hpx-navbtn-browser"></button>
    <button class="hpx-navbtn" data-view="coverage" id="hpx-navbtn-coverage"></button>
    <button class="hpx-navbtn" data-view="game" id="hpx-navbtn-game"></button>
  </div>
</nav>

<!-- ============================= VIEW: BROWSER ============================= -->
<section class="hpx-view hpx-wrap" id="hpx-view-browser" hidden>
  <div class="hpx-sec">
    <h2 id="hpx-browser-heading"></h2>
    <p class="hpx-intro" id="hpx-browser-intro"></p>
    <div class="hpx-browse-controls">
      <select class="hpx-select" id="hpx-candidate-select"></select>
      <span class="hpx-browse-count" id="hpx-browse-count"></span>
    </div>
    <div id="hpx-browser-detail"></div>
  </div>
</section>

<!-- ============================= VIEW: COVERAGE ============================= -->
<section class="hpx-view hpx-wrap" id="hpx-view-coverage" hidden>
  <div class="hpx-sec">
    <h2 id="hpx-coverage-heading"></h2>
    <p class="hpx-intro" id="hpx-coverage-intro"></p>
    <p class="hpx-order-label" id="hpx-coverage-order"></p>
    <div class="hpx-table-wrap"><table class="hpx-table" id="hpx-coverage-table"></table></div>
  </div>
</section>

<!-- ============================= VIEW: GAME ============================= -->
<section class="hpx-view hpx-wrap" id="hpx-view-game" hidden>
  <div class="hpx-sec">
    <h2 id="hpx-game-heading"></h2>
    <p class="hpx-intro" id="hpx-game-intro"></p>
    <div id="hpx-game-body"></div>
  </div>
</section>

<footer class="hpx-foot hpx-wrap" id="hpx-footer"></footer>
</div>
<script type="application/json" id="hpx-data">/*__HPX_DATA_JSON__*/</script>
<script>
(function(){
  "use strict";

  var HPX = JSON.parse(document.getElementById("hpx-data").textContent);

  var STRINGS = {

    pair_gem_tag: "Hidden gem",

    coverage_order_default: "Order: application order (candidate ID), unsorted",

  };

  function el(tag, cls, parent, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(n, d){ if (d === undefined) d = 1; return (Math.round(n * Math.pow(10,d)) / Math.pow(10,d)).toFixed(d); }
  function fmtPct(n, d){ return fmt(n, d) + "%"; }

  var CAT_LABEL = {
    must_have: STRINGS.requirement_category_must_have,
    desirable: STRINGS.requirement_category_desirable,
    constraint: STRINGS.requirement_category_constraint
  };
  var REQ_BY_ID = {};
  HPX.meta.requirements.forEach(function(r){ REQ_BY_ID[r.id] = r; });
  var CANDIDATE_BY_ID = {};
  HPX.candidates.forEach(function(c){ CANDIDATE_BY_ID[c.id] = c; });

  function byId(cid){ return CANDIDATE_BY_ID[cid]; }

  // Chip class + label lookups across the three status vocabularies in play.
  function keyChip(status){
    if (status === "evidenced") return "hpx-chip--met";
    if (status === "claimed_only") return "hpx-chip--caution";
    if (status === "contradicted") return "hpx-chip--flagged";
    return "hpx-chip--muted";
  }
  function dossierChip(status){
    if (status === "evidence_found") return "hpx-chip--met";
    if (status === "claim_only") return "hpx-chip--caution";
    if (status === "contradiction") return "hpx-chip--flagged";
    return "hpx-chip--muted";
  }
  function naiveChip(met){
    if (met === "yes") return "hpx-chip--met";
    if (met === "partial") return "hpx-chip--caution";
    return "hpx-chip--muted";
  }
  function keyLabel(status){ return HPX.meta.status_labels_key[status] || status; }
  function dossierLabel(status){ return HPX.meta.status_labels_dossier[status] || status; }
  function naiveLabel(met){ return HPX.meta.naive_met_labels[met] || met; }

  // ------------------------------------------------------------------
  // Very small, safe Markdown-lite renderer for CV / cover-letter text:
  // handles #/##/### headings, blank-line paragraphs, and "- " bullet
  // lists, with **bold** inline. Escapes HTML first, so this never
  // executes anything from the (trusted, but still) source text.
  // ------------------------------------------------------------------
  function escapeHtml(s){
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inlineMd(s){
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }
  function renderMarkdownLite(text){
    var lines = text.split("\n");
    var html = [];
    var listOpen = false;
    function closeList(){ if (listOpen){ html.push("</ul>"); listOpen = false; } }
    lines.forEach(function(line){
      var trimmed = line.trim();
      if (trimmed === ""){ closeList(); return; }
      var heading = trimmed.match(/^(#{1,4})\s+(.*)$/);
      if (heading){
        closeList();
        var level = Math.min(heading[1].length + 3, 6);
        html.push("<h" + level + ">" + inlineMd(heading[2]) + "</h" + level + ">");
        return;
      }
      var bullet = trimmed.match(/^[-*]\s+(.*)$/);
      if (bullet){
        if (!listOpen){ html.push("<ul>"); listOpen = true; }
        html.push("<li>" + inlineMd(bullet[1]) + "</li>");
        return;
      }
      closeList();
      html.push("<p>" + inlineMd(trimmed) + "</p>");
    });
    closeList();
    return html.join("\n");
  }

  // ------------------------------------------------------------------

  // dossier-reveal step) -- one dossier requirement row -> one card.
  // ------------------------------------------------------------------
  function renderDossierCard(container, dossierRow){
    var req = REQ_BY_ID[dossierRow.r];
    var card = el("div", "hpx-req-detail", container);
    var head = el("div", "hpx-req-head", card);
    el("span", "hpx-req-name", head, req.nm);
    var chips = el("span", null, head);
    el("span", "hpx-chip hpx-chip--muted", chips, CAT_LABEL[dossierRow.cat]).style.marginRight = "6px";
    el("span", "hpx-chip " + dossierChip(dossierRow.st), chips, dossierLabel(dossierRow.st));
    (dossierRow.ln || []).forEach(function(line){
      var q = el("div", "hpx-quote", card);
      q.appendChild(document.createTextNode(line.q));
      el("cite", null, q, line.s);
    });
    if (dossierRow.nt) el("p", "hpx-note", card, dossierRow.nt);
    return card;
  }

  function renderPairCard(container, side, kind){
    var card = el("div", "hpx-pair-card hpx-pair-card--" + kind, container);
    el("span", "hpx-pair-tag", card, kind === "gem" ? STRINGS.pair_gem_tag : STRINGS.pair_stuffer_tag);
    el("h3", null, card, side.nm + " -- " + side.id);
    var meta = el("div", "hpx-pair-meta", card);
    var m1 = el("span", null, meta); m1.appendChild(document.createTextNode(STRINGS.pair_ats_rank_label + ": ")); el("b", null, m1, String(side.ats_rank) + " / " + HPX.meta.n_candidates);
    var m2 = el("span", null, meta); m2.appendChild(document.createTextNode(STRINGS.pair_ats_score_label + ": ")); el("b", null, m2, String(side.ats_score));

    var expanded = kind === "gem" ? pairState.gemExpanded : pairState.stufferExpanded;
    var toggle = el("button", "hpx-btn", card, expanded ? STRINGS.pair_collapse : STRINGS.pair_expand);
    toggle.style.marginBottom = "10px";
    toggle.addEventListener("click", function(){
      if (kind === "gem") pairState.gemExpanded = !pairState.gemExpanded; else pairState.stufferExpanded = !pairState.stufferExpanded;
      renderMatchedPair();
      reportHeight();
    });

    var reads = side.reads.filter(function(r){ return expanded || r.cat === "must_have"; });
    reads.forEach(function(r){
      var block = el("div", "hpx-req-detail", card);
      var head = el("div", "hpx-req-head", block);
      el("span", "hpx-req-name", head, r.nm);
      el("span", "hpx-chip " + keyChip(r.key_st), head, STRINGS.pair_col_key + ": " + keyLabel(r.key_st));
      if (r.key_note) el("p", "hpx-note", block, r.key_note);

      var armGrid = el("div", "hpx-arm-grid", block);
      var atsCell = el("div", "hpx-arm-cell", armGrid);
      el("span", "hpx-arm-label", atsCell, STRINGS.pair_col_ats);
      el("span", "hpx-chip " + (r.ats_hit ? "hpx-chip--met" : "hpx-chip--muted"), atsCell, r.ats_hit ? STRINGS.pair_ats_hit : STRINGS.pair_ats_miss);

      var naiveCell = el("div", "hpx-arm-cell", armGrid);
      el("span", "hpx-arm-label", naiveCell, STRINGS.pair_col_naive);
      el("span", "hpx-chip " + naiveChip(r.naive_met), naiveCell, naiveLabel(r.naive_met));
      el("p", null, naiveCell, r.naive_reason);

      var arm3Cell = el("div", "hpx-arm-cell", armGrid);
      el("span", "hpx-arm-label", arm3Cell, STRINGS.pair_col_arm3);
      el("span", "hpx-chip " + dossierChip(r.arm3_st), arm3Cell, dossierLabel(r.arm3_st));
      (r.arm3_lines || []).forEach(function(l){ el("p", null, arm3Cell, "“" + l.q + "”"); });

      var arm4Cell = el("div", "hpx-arm-cell", armGrid);
      el("span", "hpx-arm-label", arm4Cell, STRINGS.pair_col_arm4);
      el("span", "hpx-chip " + dossierChip(r.arm4_st), arm4Cell, dossierLabel(r.arm4_st));
      (r.arm4_lines || []).forEach(function(l){ el("p", null, arm4Cell, "“" + l.q + "”"); });

      if (kind === "stuffer" && r.r === "R05"){
        var oc = el("div", "hpx-overcredit", block);
        el("strong", null, oc, "Note: ");
        oc.appendChild(document.createTextNode(STRINGS.pair_overcredit_note));
      }
    });
  }

  // ------------------------------------------------------------------

  var VIEWS = ["browser", "coverage", "game"];

  function showView(name){

  function renderBrowserDetail(){

  // ==================================================================
  // VIEW: COVERAGE TABLE
  // ==================================================================
  var coverageState = { sortCol: null, sortDir: "asc" };

  var COVERAGE_COLUMNS = [
    { key: "id", label: function(){ return STRINGS.coverage_col_id; } },
    { key: "nm", label: function(){ return STRINGS.coverage_col_name; } },
    { key: "mh_found", label: function(){ return STRINGS.coverage_col_mh_found; } },
    { key: "mh_claim", label: function(){ return STRINGS.coverage_col_mh_claim; } },
    { key: "des_found", label: function(){ return STRINGS.coverage_col_desirable_found; } },
    { key: "contradiction", label: function(){ return STRINGS.coverage_col_contradiction; } },
    { key: "not_stated", label: function(){ return STRINGS.coverage_col_not_stated; } }
  ];

  function coverageRows(){
    return HPX.candidates.map(function(c){
      var row = { id: c.id, nm: c.nm, mh_found: 0, mh_claim: 0, des_found: 0, contradiction: 0, not_stated: 0 };
      c.ds.forEach(function(r){
        if (r.cat === "must_have" && r.st === "evidence_found") row.mh_found++;
        if (r.cat === "must_have" && r.st === "claim_only") row.mh_claim++;
        if (r.cat === "desirable" && r.st === "evidence_found") row.des_found++;
        if (r.st === "contradiction") row.contradiction++;
        if (r.st === "not_stated") row.not_stated++;
      });
      return row;
    });
  }

  function initCoverageView(){
    document.getElementById("hpx-coverage-heading").textContent = STRINGS.coverage_heading;
    document.getElementById("hpx-coverage-intro").textContent = STRINGS.coverage_intro;
    renderCoverageTable();
  }

  function renderCoverageTable(){
    var orderLabel = document.getElementById("hpx-coverage-order");
    if (coverageState.sortCol === null){
      orderLabel.textContent = STRINGS.coverage_order_default;
    } else {
      var col = COVERAGE_COLUMNS.filter(function(c){ return c.key === coverageState.sortCol; })[0];
      orderLabel.innerHTML = "";
      orderLabel.appendChild(document.createTextNode(
        STRINGS.coverage_order_sorted(col.label(), coverageState.sortDir === "asc" ? "ascending" : "descending") + " -- "
      ));
      var resetBtn = document.createElement("button");
      resetBtn.className = "hpx-btn";
      resetBtn.textContent = STRINGS.coverage_reset;
      resetBtn.style.fontSize = "10px";
      resetBtn.style.padding = "3px 8px";
      resetBtn.addEventListener("click", function(){ coverageState.sortCol = null; renderCoverageTable(); });
      orderLabel.appendChild(resetBtn);
    }

    var rows = coverageRows();
    if (coverageState.sortCol !== null){
      var key = coverageState.sortCol, dir = coverageState.sortDir === "asc" ? 1 : -1;
      rows.sort(function(a, b){
        if (a[key] < b[key]) return -1 * dir;
        if (a[key] > b[key]) return 1 * dir;
        return 0;
      });
    }

    var table = document.getElementById("hpx-coverage-table");
    table.innerHTML = "";
    var thead = el("thead", null, table);
    var htr = el("tr", null, thead);
    COVERAGE_COLUMNS.forEach(function(col){
      var th = el("th", null, htr, col.label());
      if (coverageState.sortCol === col.key) th.classList.add("is-sorted");
      th.addEventListener("click", function(){
        if (coverageState.sortCol === col.key){
          coverageState.sortDir = coverageState.sortDir === "asc" ? "desc" : "asc";
        } else {
          coverageState.sortCol = col.key;
          coverageState.sortDir = "asc";
        }
        renderCoverageTable();
      });
    });

    var tbody = el("tbody", null, table);
    rows.forEach(function(row){
      var tr = el("tr", "hpx-rowlink", tbody);
      el("td", null, tr, row.id);
      el("td", null, tr, row.nm);
      el("td", "hpx-num", tr, String(row.mh_found));
      el("td", "hpx-num", tr, String(row.mh_claim));
      el("td", "hpx-num", tr, String(row.des_found));
      el("td", "hpx-num", tr, String(row.contradiction));
      el("td", "hpx-num", tr, String(row.not_stated));
      tr.addEventListener("click", function(){ window.hpxSelectCandidate(row.id); });
    });
    reportHeight();
  }

  // ==================================================================
  // VIEW: GAME MODE
  // ==================================================================
  var SECONDS_PER_APPLICATION = 90;
  var gameState = { stage: "intro", index: 0, timeLeft: SECONDS_PER_APPLICATION, timerId: null,
                     unaided: {}, revised: {} };

  function initGameView(){
    document.getElementById("hpx-game-heading").textContent = STRINGS.game_heading;
    document.getElementById("hpx-game-intro").textContent = STRINGS.game_intro;
    renderGame();
  }

  function resetGame(){
    stopTimer();
    gameState = { stage: "intro", index: 0, timeLeft: SECONDS_PER_APPLICATION, timerId: null, unaided: {}, revised: {} };
    renderGame();
  }

  function stopTimer(){
    if (gameState.timerId){ clearInterval(gameState.timerId); gameState.timerId = null; }
  }

  function startTimer(){
    stopTimer();
    gameState.timerId = setInterval(function(){
      gameState.timeLeft--;
      if (gameState.timeLeft <= 0){
        stopTimer();
        lockInScreen(true);
        return;
      }
      updateTimerDisplay();
    }, 1000);
  }

  function updateTimerDisplay(){
    var fill = document.getElementById("hpx-timer-fill");
    var num = document.getElementById("hpx-timer-num");
    if (!fill || !num) return;
    var pct = Math.max(0, (gameState.timeLeft / SECONDS_PER_APPLICATION) * 100);
    fill.style.width = pct + "%";
    num.textContent = STRINGS.game_seconds_left(Math.max(0, gameState.timeLeft));
  }

  function currentGameCandidateId(){ return HPX.game[gameState.index].id; }

  function lockInScreen(timedOut){
    stopTimer();
    var picked = document.querySelector('input[name="hpx-game-decision"]:checked');
    gameState.unaided[currentGameCandidateId()] = picked ? picked.value : null;
    gameState.index++;
    if (gameState.index >= HPX.game.length){
      gameState.stage = "recap";
    } else {
      gameState.timeLeft = SECONDS_PER_APPLICATION;
    }
    renderGame();
  }

  function renderGame(){
    var host = document.getElementById("hpx-game-body");
    host.innerHTML = "";

    if (gameState.stage === "intro"){
      var startBtn = el("button", "hpx-btn", host, STRINGS.game_start);
      startBtn.addEventListener("click", function(){
        gameState.stage = "screen";
        gameState.index = 0;
        gameState.timeLeft = SECONDS_PER_APPLICATION;
        renderGame();
        startTimer();
      });
      return;
    }

    if (gameState.stage === "screen"){
      var pick = HPX.game[gameState.index];
      var c = byId(pick.id);
      var box = el("div", "hpx-game-box", host);
      el("div", "hpx-game-progress", box, STRINGS.game_progress(gameState.index + 1, HPX.game.length));
      var timerWrap = el("div", "hpx-timer-wrap", box);
      var track = el("div", "hpx-timer-bar-track", timerWrap);
      var fill = el("div", "hpx-timer-bar-fill", track); fill.id = "hpx-timer-fill";
      var num = el("span", "hpx-timer-num", timerWrap); num.id = "hpx-timer-num";

      el("h3", null, box, c.nm + " -- " + c.id);
      var appText = el("div", "hpx-app-text", box);
      el("h5", null, appText, STRINGS.browser_cv_label);
      appText.insertAdjacentHTML("beforeend", renderMarkdownLite(c.cv));
      el("h5", null, appText, STRINGS.browser_letter_label).style.marginTop = "14px";
      appText.insertAdjacentHTML("beforeend", renderMarkdownLite(c.lt));

      var decRow = el("div", "hpx-decision-row", box);
      el("span", "hpx-mono", decRow, STRINGS.game_decision_label);
      [["advance", STRINGS.game_decision_advance], ["hold", STRINGS.game_decision_hold], ["decline", STRINGS.game_decision_decline]].forEach(function(pair){
        var label = document.createElement("label");
        var radio = document.createElement("input");
        radio.type = "radio"; radio.name = "hpx-game-decision"; radio.value = pair[0];
        label.appendChild(radio);
        label.appendChild(document.createTextNode(" " + pair[1]));
        decRow.appendChild(label);
      });

      var lockBtn = el("button", "hpx-btn", box, STRINGS.game_lock_in);
      lockBtn.addEventListener("click", function(){ lockInScreen(false); });

      updateTimerDisplay();
      return;
    }

    if (gameState.stage === "recap"){
      el("h3", null, host, STRINGS.game_recap_heading);
      var table = el("table", "hpx-recap-table", host);
      var thead = el("thead", null, table);
      var htr = el("tr", null, thead);
      el("th", null, htr, STRINGS.game_recap_col_candidate);
      el("th", null, htr, STRINGS.game_recap_col_call);
      var tbody = el("tbody", null, table);
      HPX.game.forEach(function(pick){
        var c = byId(pick.id);
        var tr = el("tr", null, tbody);
        el("td", null, tr, c.nm + " (" + c.id + ")");
        el("td", null, tr, callLabel(gameState.unaided[pick.id]));
      });
      var seeBtn = el("button", "hpx-btn", host, STRINGS.game_see_dossiers);
      seeBtn.addEventListener("click", function(){ gameState.stage = "dossier"; renderGame(); reportHeight(); });
      return;
    }

    if (gameState.stage === "dossier"){
      el("h3", null, host, STRINGS.game_recap_heading);
      var recapTable = el("table", "hpx-recap-table", host);
      var rthead = el("thead", null, recapTable);
      var rhtr = el("tr", null, rthead);
      el("th", null, rhtr, STRINGS.game_recap_col_candidate);
      el("th", null, rhtr, STRINGS.game_recap_col_call);
      var rtbody = el("tbody", null, recapTable);
      HPX.game.forEach(function(pick){
        var c = byId(pick.id);
        var tr = el("tr", null, rtbody);
        el("td", null, tr, c.nm + " (" + c.id + ")");
        el("td", null, tr, callLabel(gameState.unaided[pick.id]));
      });

      el("h3", null, host, STRINGS.game_dossier_heading).style.marginTop = "18px";
      el("p", "hpx-intro", host, STRINGS.game_dossier_intro);

      HPX.game.forEach(function(pick){
        var c = byId(pick.id);
        var block = el("div", "hpx-game-candidate-block", host);
        el("h4", null, block, c.nm + " -- " + c.id);
        var dossierWrap = el("div", null, block);
        c.ds.forEach(function(row){ renderDossierCard(dossierWrap, row); });

        var revRow = el("div", "hpx-decision-row", block);
        el("span", "hpx-mono", revRow, STRINGS.game_decision_label);
        var current = gameState.revised[pick.id] !== undefined ? gameState.revised[pick.id] : gameState.unaided[pick.id];
        [["advance", STRINGS.game_decision_advance], ["hold", STRINGS.game_decision_hold], ["decline", STRINGS.game_decision_decline]].forEach(function(pairOpt){
          var label = document.createElement("label");
          var radio = document.createElement("input");
          radio.type = "radio"; radio.name = "hpx-revise-" + pick.id; radio.value = pairOpt[0];
          radio.checked = current === pairOpt[0];
          radio.addEventListener("change", function(){ gameState.revised[pick.id] = pairOpt[0]; });
          label.appendChild(radio);
          label.appendChild(document.createTextNode(" " + pairOpt[1]));
          revRow.appendChild(label);
        });
      });

      var keyBtn = el("button", "hpx-btn", host, STRINGS.game_see_key);
      keyBtn.addEventListener("click", function(){ gameState.stage = "key"; renderGame(); reportHeight(); });
      return;
    }

    if (gameState.stage === "key"){
      renderKeyStage(host);
      return;
    }
  }

  function callLabel(value){
    if (value === "advance") return STRINGS.game_decision_advance;
    if (value === "hold") return STRINGS.game_decision_hold;
    if (value === "decline") return STRINGS.game_decision_decline;
    return "—";
  }

  function renderKeyStage(host){
    el("h3", null, host, STRINGS.game_key_heading).style.marginTop = "18px";
    el("p", "hpx-intro", host, STRINGS.game_key_intro);

    var unaidedMatches = 0, revisedMatches = 0, scoreable = 0;

    HPX.game.forEach(function(pick){
      var c = byId(pick.id);
      var block = el("div", "hpx-game-candidate-block", host);
      el("span", "hpx-role-tag", block, pick.role_label);
      el("h4", null, block, c.nm + " -- " + c.id);

      var unaidedCall = gameState.unaided[pick.id];
      var revisedCall = gameState.revised[pick.id] !== undefined ? gameState.revised[pick.id] : unaidedCall;

      var table = el("table", "hpx-recap-table", block);
      var thead = el("thead", null, table);
      var htr = el("tr", null, thead);
      [STRINGS.game_key_col_unaided, STRINGS.game_key_col_revised, STRINGS.game_key_col_reading].forEach(function(h){ el("th", null, htr, h); });
      var tbody = el("tbody", null, table);
      var tr = el("tr", null, tbody);
      el("td", null, tr, callLabel(unaidedCall));
      el("td", null, tr, callLabel(revisedCall));
      el("td", null, tr, HPX.meta.archetype_labels[c.ar] || c.ar);

      if (pick.expected_call === null){
        el("p", "hpx-note", block, STRINGS.game_borderline_note);
      } else {
        scoreable++;
        var matchU = unaidedCall === pick.expected_call;
        var matchR = revisedCall === pick.expected_call;
        if (matchU) unaidedMatches++;
        if (matchR) revisedMatches++;
        var matchP = el("p", null, block);
        el("span", matchU ? "hpx-match-yes" : "hpx-match-no", matchP, unaidedCall === null ? STRINGS.game_match_na : (matchU ? STRINGS.game_match_yes : STRINGS.game_match_no));
        matchP.appendChild(document.createTextNode(" (unaided) "));
        var matchP2 = el("p", null, block);
        el("span", matchR ? "hpx-match-yes" : "hpx-match-no", matchP2, revisedCall === null ? STRINGS.game_match_na : (matchR ? STRINGS.game_match_yes : STRINGS.game_match_no));
        matchP2.appendChild(document.createTextNode(" (after dossier) "));
      }

      // Key summary: must-have rows only, compact.
      var keyList = el("div", null, block);
      c.key.filter(function(k){ return k.cat === "must_have"; }).forEach(function(k){
        var line = el("div", "hpx-keypanel-row", keyList);
        el("span", "hpx-keypanel-req", line, (REQ_BY_ID[k.r] || {nm: k.r}).nm);
        el("span", "hpx-chip " + keyChip(k.st), line, keyLabel(k.st));
      });
    });

    var tally = el("div", "hpx-tally-strip", host);
    [[unaidedMatches, scoreable, STRINGS.game_tally_unaided], [revisedMatches, scoreable, STRINGS.game_tally_revised]].forEach(function(t){
      var d = el("div", null, tally);
      el("b", null, d, STRINGS.game_tally_of(t[0], t[1]));
      el("span", null, d, t[2]);
    });

    var againBtn = el("button", "hpx-btn", host, STRINGS.game_play_again);
    againBtn.addEventListener("click", resetGame);
  }

  // ------------------------------------------------------------------
  // Init + iframe height reporting
  // ------------------------------------------------------------------
  function reportHeight(){
    try { parent.postMessage({type: "hpx-height", height: document.documentElement.scrollHeight}, "*"); } catch(e){}
  }
  renderHeader();
  renderMatchedPair();
  setupNav();
  showView("browser");
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
})();
</script>
</body>
</html>
